# Dependabot — the dependency-drift sensor.
#
# Pairs with the `vuln` (govulncheck) CI job: govulncheck tells us when a
# dependency we already have is known-vulnerable; dependabot keeps us from
# drifting so far behind that upgrading is a project of its own.
version: 2

updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - go
    groups:
      # One PR per week for the routine, low-risk churn; majors stay separate
      # so they get reviewed on their own.
      go-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Pinned action versions and the go-version used by setup-go.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # docs/ is a separate npm workspace (Docusaurus site) that gomod/govulncheck
  # never see — without this, npm CVEs here go undetected until someone
  # manually runs `npm audit` (see the 2026-08-29 remediation: 7 alerts were
  # unnoticed for this reason before this ecosystem was added).
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "npm"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "docs"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # web/ is the inventory-mfe Vite micro-frontend (its own npm tree).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "npm"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "web"
    groups:
      web-npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
