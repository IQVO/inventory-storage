# VERBATIM copy of warehouse-infra helm-values/inventory-storage.yaml (origin/develop 5e552f5).
# render_test.sh renders the chart with exactly the values warehouse-infra
# deploys (layered _platform -> app, as the ArgoCD Application does), so a chart
# change that would break the real release fails here first. Do not edit by
# hand: re-copy from warehouse-infra.

# inventory-storage — Inventory & Storage bounded context.
#
# Startup: runs postgres.RunMigrations(DATABASE_URL, MIGRATIONS_PATH) before
# serving, so the pod is briefly unready on a cold database. The liveness probe
# below is relaxed accordingly (the chart default, 5s + 3 failures, can kill
# the pod mid-migration on a slow first boot).
#
# Kafka: live now that warehouse-infra runs a real Kafka release (kafka.tf).
#
# Analytics: the projector+reports pair (ADR-0010) is turned on here — see
# wes-work-planning.yaml's comment for the full rationale.

replicaCount: 1

config:
  httpAddr: ":8080"
  eventPublisher: "kafka"
  migrationsPath: "migrations"
  # Site-scoped transfer allocation command consumer (ADR-0030): consumes
  # network-inventory-planning's TransferAllocationRequested commands from
  # warehouse.network-inventory-planning.events. The chart natively
  # templates TRANSFER_ALLOCATION_CONSUMER_MODE/GROUP from these keys --
  # setting them via extraEnv would duplicate the chart's own env entries
  # and break ArgoCD's three-way diff. The group id is the chart's own documented default, set
  # explicitly so the Deployment's env is self-describing; a locally-run
  # process overrides it so it can never steal the live Deployment's
  # partitions.
  transferAllocationConsumerMode: "kafka"
  transferAllocationConsumerGroup: "inventory-storage-transfer-allocation"
  # product-master classification local copy (inventory-storage ADR-0034;
  # product-master ADR 0003 stage D): consume ProductClassified from
  # warehouse.product-master.events into product_classifications. A DEDICATED
  # chart value (rendered to PRODUCT_MASTER_CONSUMER_GROUP), so it lives here and
  # never in extraEnv. A fixed, stable id: a restarted pod resumes from its
  # committed offsets. Empty would leave the consumer off.
  productMasterConsumerGroup: "inventory-storage-product-master"
  # inbound-receiving handover (inventory-storage ADR-0037): consume
  # ReceiptLineReceived from warehouse.inbound-receiving.events and book every
  # condition=Good line as a staged receipt (StockReceived).
  # A DEDICATED chart value (rendered to the inbound-receipt consumer group env
  # var), so it lives here and never in extraEnv. A fixed, stable id: a
  # restarted pod resumes from its committed offsets. Empty would leave the
  # consumer off. StockReceived leaves the service through the outbox relay,
  # which needs config.eventPublisher=kafka (set above).
  inboundReceiptConsumerGroup: "inventory-storage-inbound-receipts"
  # TaskCompleted consumer (inventory-storage ADR-0035 confirm-pick + ADR 0039
  # relocation): consumes fulfillment-execution's TaskCompleted from
  # warehouse.fulfillment.events. A PICK completion counts toward its order and
  # the order's LAST pick confirms its reservations (StockPicked); a RELOCATE
  # completion runs RelocateStock (the same use case as POST /relocations) and
  # raises StockRelocated, which slotting-optimization consumes for plan
  # progress (RELOCATION_MODE=kafka in slotting-optimization.yaml). Without
  # this, completed slot-plan moves never reach the stock ledger (the chart
  # default is "off"). Needs database.* + kafka.enabled (set) and
  # EVENT_PUBLISHER=kafka (set above). A DEDICATED chart value (rendered to
  # TASK_COMPLETED_CONSUMER_MODE/GROUP), never extraEnv; the group is the
  # binary's own documented default, set explicitly so the Deployment's env
  # is self-describing. Poison messages go to warehouse.fulfillment.events.dlq.
  taskCompletedConsumerMode: "kafka"
  taskCompletedConsumerGroup: "inventory-storage-confirm-pick"

  # K4: bin classification from a facility-events cache. Rollback R6
  # (docs/rollback-switches.md): http plus facilityLayoutBaseUrl.
  locationLookupMode: kafka
kafka:
  enabled: true
analytics:
  enabled: true

  database:
    existingSecret: inventory-storage-analytics-db
  reports:
    route:
      enabled: true
      path: /api/inventory-storage/reports
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6

# Formerly computed by terraform/services.tf (ADR 0002 phase 3, docs/adr/0002-application-delivery-boundary.md).
# Platform facts (Gateway parentRefs, Kafka brokers, OTLP endpoint, CORS origin) come from
# _platform.yaml; image tags from Terraform (the Application's valuesObject).
database:
  existingSecret: inventory-storage-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/inventory-storage-frontend
gatewayApi:
  enabled: true
  hosts:
    - path: /api/inventory-storage
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/inventory-storage
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/inventory-storage
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/inventory-storage
pathCatalogue:
  content: ''
  enabled: false
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
