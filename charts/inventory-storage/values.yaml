# Default values for inventory-storage.

replicaCount: 1

image:
  repository: inventory-storage
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: inventory-storage.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute — additive, disabled-by-default alternative to the
# Ingress above. Chart-driven equivalent of the raw kubectl HTTPRoute proven
# live against Kong's Ingress Controller in warehouse-infra's
# fulfillment-execution pilot (Kong routes HTTPRoute traffic once its
# GatewayClass carries konghq.com/gatewayclass-unmanaged: "true"). Leaving
# this disabled makes it a strict no-op; set gatewayApi.enabled=true to
# switch this service from Ingress to HTTPRoute.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type (mirrors order-management's ADR-0026, the fleet's Phase 3
# scalability reference). Every block below defaults `enabled: false` so
# this PR cannot silently change production replica behaviour on merge --
# the fleet turns these on deliberately later, after this PR proves the
# shape is correct. When a component's autoscaling.<x>.enabled=true, that
# Deployment's own replicaCount / analytics.<x>.replicaCount value is
# OMITTED from the rendered manifest (see each deployment template's
# `{{- if not .Values.autoscaling.<x>.enabled }}` guard) so the HPA
# controller is the SOLE owner of .spec.replicas -- a hardcoded
# `replicas:` field competing with the HPA would otherwise fight it on
# every reconcile.
#
# mcp deliberately has NO block here (skipped, not just disabled): its
# StreamableHTTPHandler (github.com/modelcontextprotocol/go-sdk/mcp,
# see internal/adapters/inbound/mcp/server.go) keeps a per-process,
# in-memory session store keyed by the MCP protocol's own Mcp-Session-Id
# header (a real session, not just a TCP/HTTP connection) -- the same
# SDK version and wiring shape order-management's ADR-0026 already
# assessed as unsafe to scale. charts/inventory-storage/templates/
# mcp-service.yaml is a plain ClusterIP Service with no sessionAffinity
# configured, so a second request carrying the same Mcp-Session-Id (e.g.
# a tools/call following an earlier initialize) could be routed by
# kube-proxy to a DIFFERENT pod than the one that created the session,
# which has never heard of that session id and would reject it. Fixing
# this for real needs either sessionAffinity: ClientIP (a partial
# mitigation only) or wiring the SDK's StreamableHTTPOptions.EventStore
# to a shared/external session store -- a real code change out of scope
# for this chart-and-pgxpool-tuning PR. mcp.replicaCount therefore stays
# a plain, manually-set value; no autoscaling.mcp block exists in
# values.yaml at all. Revisit if/when cmd/mcp adopts an external session
# store or the SDK's stateless mode.
autoscaling:
  # cmd/inventory (this Deployment): stateless OLTP HTTP service. Its only
  # per-process cache (the LOCATION_LOOKUP_MODE=kafka facility-location
  # cache, internal/adapters/outbound/facilitycache) is fed by a
  # per-process-UNIQUE consumer group (uniqueConsumerGroup(), see that
  # package's consumer.go) that rebuilds the cache from a full replay on
  # every process start -- safe to run N independent copies of by design,
  # never a collision risk between replicas. No other in-memory session
  # state exists on this path. max 4 / target 70% CPU per the fleet's
  # reference (order-management ADR-0026).
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/inventory-projector: see analytics.projector's own comment below
  # for why max is capped at 2, not 4 -- it is a Kafka consumer under a
  # stable shared group, not a plain stateless HTTP server.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/inventory-reports: stateless read-only REST reader over its own
  # read-only pgxpool (analyticsstore.NewReadOnlyPool) -- no in-memory
  # state, safe to run N independent copies of.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle): pure
  # static-asset serving, no server-side session or per-request state
  # whatsoever -- the most trivially horizontally scalable workload in
  # this chart.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# deployment.environment.name on every span, metric and log this service
# exports. Set per-cluster (local / staging / production).
environment: "local"

# Falls back to in-memory adapters + log-only event publishing when
# database.url / kafka.enabled are left empty, same as running the binary
# locally with no env vars set.
config:
  httpAddr: ":8080"
  eventPublisher: "log"   # "log" or "kafka"
  migrationsPath: "migrations"
  logLevel: "info"        # debug | info | warn | error
  # Where cmd/inventory resolves bin -> location classification (ADR-0013 /
  # ADR-0009). kafka = facility-events cache (needs kafka.enabled),
  # http = synchronous facility-layout call (needs facilityLayoutBaseUrl),
  # permissive = accept every bin (rollback / local).
  locationLookupMode: "permissive"
  facilityLayoutBaseUrl: ""   # FACILITY_LAYOUT_BASE_URL (LOCATION_LOOKUP_MODE=http)
  # Transactional-outbox relay poll interval (ADR-0017); OUTBOX_RELAY_INTERVAL.
  outboxRelayInterval: "1s"
  # Housekeeping sweeper (ADR-0026): how often it runs, how long an
  # idempotency key is kept, how long PUBLISHED outbox rows are kept.
  housekeepingInterval: "1h"
  idempotencyKeyTtl: "24h"
  outboxRetention: "168h"
  # Site-scoped transfer allocation command consumer (ADR-0030). "kafka"
  # enables consuming network-inventory-planning's
  # TransferAllocationRequested commands; requires database.* and
  # kafka.enabled (the decision is only atomic through the Postgres
  # UnitOfWork/outbox). transferConsumerGroup overrides the consumer
  # group id (default inventory-storage-transfer-allocation) so a
  # locally-run process can never steal the live Deployment's partitions.
  transferAllocationConsumerMode: "off"
  transferAllocationConsumerGroup: ""
  # product-master classification local copy (ADR-0034). Set to a stable
  # group id (e.g. inventory-storage-product-master) to consume
  # product-master's ProductClassified from warehouse.product-master.events
  # into product_classifications; empty = consumer not started. Requires
  # database.* and kafka.enabled.
  productMasterConsumerGroup: ""

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup
  # step (cmd/inventory/main.go, cmd/mcp/main.go) -- never for the runtime
  # pgxpool, which always uses existingSecretKey/DATABASE_URL above,
  # unchanged. `optional: true` below so a secret that predates this key
  # (local dev, an environment whose Terraform hasn't been rolled yet)
  # still starts the pod: the Go binary's own
  # getenv("MIGRATIONS_DATABASE_URL", databaseURL) fallback then makes
  # migrations run against DATABASE_URL, exactly as before this key
  # existed. See ADR-0023 for the PgBouncer/pg_advisory_lock
  # incompatibility this key exists to route migrations around (mirrors
  # order-management's ADR-0029).
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# Kafka wiring. This service PUBLISHES (StockReserved /
# ReservationRevoked / the ADR-0030 transfer replies) and, when
# config.transferAllocationConsumerMode=kafka, CONSUMES
# network-inventory-planning's transfer allocation commands; when
# config.productMasterConsumerGroup is set it also CONSUMES product-master's
# ProductClassified (ADR-0034).
# kafka.enabled gates EVENT_PUBLISHER=kafka.
kafka:
  enabled: false
  brokers: "kafka:9092"

# OpenTelemetry traces + metrics, pushed over OTLP/gRPC to a Collector. The
# endpoint below is the in-cluster Collector Service in the warehouse-infra
# kind cluster. Export is non-blocking, so a Collector that is down costs
# telemetry and nothing else — but otel.enabled=false skips the env entirely.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "inventory-storage"

extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    # /readyz (ADR-0020 §graceful shutdown), NOT /healthz: readiness
    # must flip to not-ready during a graceful drain so Kubernetes stops
    # routing new traffic here, while liveness (/healthz, below) stays a
    # pure "is the process alive" signal that a drain never touches.
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# startupProbe covers this fleet's known ~10s post-start first-outbound-dial
# reset (Istio native sidecars; holdApplicationUntilProxyStarts is a no-op
# for them): failureThreshold * periodSeconds = 60s gives the app-side boot
# retry (internal/adapters/outbound/bootretry, ~31s worst case) room to
# finish before liveness/readiness probing (and any liveness-triggered
# restart) begins.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

# Graceful shutdown budget (ADR-0020): the HTTP Shutdown drain window
# (10s) plus the outbox relay/facility-location-cache-consumer stop
# window (10s, reused) plus margin for the readinessProbe's
# periodSeconds=5 above to have actually observed the /readyz
# not-ready flip before traffic fully stops arriving.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

# --- analytics data product (ADR-0011) ---
# The per-service "Inventory Flow & Accuracy" report: a separate analytics
# topic, a writer (projector) and a read-only reader (reports), backed by a
# separate analytical database. Disabled by default so existing releases are
# unaffected; set analytics.enabled=true to deploy the two extra processes.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    # HPA min 1 / max 2, NOT 4: kafka.AnalyticsConsumerGroup
    # ("inventory-analytics") is a STABLE, shared consumer-group name with
    # no per-instance uniqueness (internal/adapters/inbound/kafka/
    # analytics_consumer.go) -- the fleet's correctly-scalable convention
    # -- so N replicas legitimately share the analytics topic's partitions
    # via normal Kafka rebalancing, not a collision risk. Capped at 2, not
    # left at api's 4, because the analytics publisher partitions by SKU
    # (internal/adapters/outbound/kafka/analytics_publisher.go's
    # marshalData), so ordering is only guaranteed per-SKU, and a wider
    # fan-out buys little extra throughput for what is a lightweight
    # idempotent-upsert workload (every write dedupes on event_id via
    # ProcessedEvents.MarkProcessed). See the top-level autoscaling.projector
    # block.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    # Stateless read-only REST reader over the analytical database (its own
    # read-only pgxpool, analyticsstore.NewReadOnlyPool) -- no in-memory
    # state, safe to run N independent copies of. max 3 / target 70% CPU,
    # same treatment as the OLTP api Deployment. See the top-level
    # autoscaling.reports block.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- MCP server (ADR-0008) ---
# The Model Context Protocol server (cmd/mcp): a second deployable over the
# same use cases and OLTP database as the HTTP service, served over Streamable
# HTTP at "/" and "/mcp" with a GET /healthz for the probes.
# Disabled by default so existing releases are unaffected; set
# mcp.enabled=true to deploy it.
#
# Deliberately NOT HPA-scalable (no autoscaling.mcp block exists in this
# chart) — see the top-level autoscaling: block's comment for the full
# reasoning: the SDK's StreamableHTTPHandler keeps in-memory, per-process
# MCP session state, and this chart's mcp-service.yaml has no session
# affinity, so a second replica could receive a mid-session request its
# own process never created. replicaCount therefore stays a plain,
# manually-set value.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/inventory-storage/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/inventory-storage-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
