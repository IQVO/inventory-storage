apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory-storage.fullname" . }}
  labels:
    {{- include "inventory-storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inventory-storage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "inventory-storage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "inventory-storage.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: LOCATION_LOOKUP_MODE
              value: {{ .Values.config.locationLookupMode | quote }}
            {{- if .Values.config.facilityLayoutBaseUrl }}
            - name: FACILITY_LAYOUT_BASE_URL
              value: {{ .Values.config.facilityLayoutBaseUrl | quote }}
            {{- end }}
            - name: TRANSFER_ALLOCATION_CONSUMER_MODE
              value: {{ .Values.config.transferAllocationConsumerMode | quote }}
            {{- if .Values.config.transferAllocationConsumerGroup }}
            - name: TRANSFER_ALLOCATION_CONSUMER_GROUP
              value: {{ .Values.config.transferAllocationConsumerGroup | quote }}
            {{- end }}
            {{- if .Values.config.productMasterConsumerGroup }}
            - name: PRODUCT_MASTER_CONSUMER_GROUP
              value: {{ .Values.config.productMasterConsumerGroup | quote }}
            {{- end }}
            {{- if .Values.config.inboundReceiptConsumerGroup }}
            - name: INBOUND_RECEIPT_CONSUMER_GROUP
              value: {{ .Values.config.inboundReceiptConsumerGroup | quote }}
            {{- end }}
            - name: TASK_COMPLETED_CONSUMER_MODE
              value: {{ .Values.config.taskCompletedConsumerMode | quote }}
            {{- if .Values.config.taskCompletedConsumerGroup }}
            - name: TASK_COMPLETED_CONSUMER_GROUP
              value: {{ .Values.config.taskCompletedConsumerGroup | quote }}
            {{- end }}
            - name: OUTBOX_RELAY_INTERVAL
              value: {{ .Values.config.outboxRelayInterval | quote }}
            - name: HOUSEKEEPING_INTERVAL
              value: {{ .Values.config.housekeepingInterval | quote }}
            - name: IDEMPOTENCY_KEY_TTL
              value: {{ .Values.config.idempotencyKeyTtl | quote }}
            - name: OUTBOX_RETENTION
              value: {{ .Values.config.outboxRetention | quote }}
            - name: ORDER_PICK_PROGRESS_RETENTION
              value: {{ .Values.config.orderPickProgressRetention | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "inventory-storage.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0023: a direct (non-pooled) connection used only for
            # the migration step below, never for the runtime pgxpool.
            # `optional: true` so a secret without this key yet (predates
            # this chart version) still starts the pod -- the binary falls
            # back to DATABASE_URL itself when this env var is unset.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "inventory-storage.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if .Values.kafka.enabled }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
