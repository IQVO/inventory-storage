apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inventory-storage.fullname" . }}
  labels:
    {{- include "inventory-storage.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOCATION_LOOKUP_MODE: {{ .Values.config.locationLookupMode | quote }}
  {{- if .Values.config.facilityLayoutBaseUrl }}
  FACILITY_LAYOUT_BASE_URL: {{ .Values.config.facilityLayoutBaseUrl | quote }}
  {{- end }}
  OUTBOX_RELAY_INTERVAL: {{ .Values.config.outboxRelayInterval | quote }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  HOUSEKEEPING_INTERVAL: {{ .Values.config.housekeepingInterval | quote }}
  IDEMPOTENCY_KEY_TTL: {{ .Values.config.idempotencyKeyTtl | quote }}
  OUTBOX_RETENTION: {{ .Values.config.outboxRetention | quote }}
  ORDER_PICK_PROGRESS_RETENTION: {{ .Values.config.orderPickProgressRetention | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- end }}
  # KAFKA_BROKERS is required (the api Deployment's guard fails the render
  # without it), so it is always rendered.
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
