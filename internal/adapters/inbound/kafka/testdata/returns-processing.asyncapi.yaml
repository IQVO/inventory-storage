              order_ref: "ord-7c9e2f1a-line-1"

  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string }
        type: { type: string }
        subject: { type: string, description: The aggregate instance id (rmaId, receiptId or dispositionId for this service's events). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        dataschema: { type: string }

    ReturnAuthorizedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [rma_id, order_id, line_no, sku, quantity, site_id, reason_code, window_ends_at, authorized_at]
              properties:
                rma_id: { type: string }
                order_id: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1, description: Capped by the policy's max_units_per_line; the shipped-quantity check is planned. }
                site_id: { type: string }
                reason_code: { type: string, description: "The operator's return reason, e.g. DAMAGED, WRONG_ITEM, NOT_NEEDED." }
                window_ends_at: { type: string, format: date-time, description: The last instant the goods may arrive. }
                authorized_at: { type: string, format: date-time }

    ReturnAuthorizationRejectedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [rma_id, order_id, line_no, sku, quantity, rejection_code, rejected_at]
              properties:
                rma_id: { type: string }
                order_id: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1 }
                rejection_code: { type: string, enum: [LINE_NOT_MANIFESTED, RETURN_WINDOW_EXPIRED, OPEN_RMA_EXISTS, QUANTITY_EXCEEDS_POLICY] }
                rejected_at: { type: string, format: date-time }

    ReceiptLineData:
      type: object
      required: [line_no, sku, quantity, rma_id]
      properties:
        line_no: { type: integer, minimum: 1 }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        rma_id: { type: string, nullable: true, description: The RMA this line matches; null means the line is UNEXPECTED. }

    ReturnReceiptOpenedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, rma_id, site_id, opened_at, lines]
              properties:
                receipt_id: { type: string }
                rma_id: { type: string, nullable: true, description: The RMA the parcel was opened against; null when the whole parcel is unexpected. }
                site_id: { type: string }
                opened_at: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/ReceiptLineData" }

    ReturnLineInspectedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, line_no, sku, quantity, grade, reason_codes, inspected_at]
              properties:
                receipt_id: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1, description: The inspected quantity; never more than the received quantity of the line. }
                grade: { type: string, enum: [A, B, C, SCRAP] }
                reason_codes: { type: array, nullable: true, items: { type: string }, description: "Why the grade; e.g. CUSTOMER_DAMAGE, OPENED_BOX, MISSING_PARTS. null when the inspection request sent no reasonCodes." }
                inspected_at: { type: string, format: date-time }

    UnexpectedReturnReceivedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, line_no, sku, quantity, site_id, received_at]
              properties:
                receipt_id: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1 }
                site_id: { type: string }
                received_at: { type: string, format: date-time }

    DispositionDecidedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [disposition_id, receipt_id, line_no, sku, quantity, grade, outcome, policy_version, supersedes, reason, decided_at]
              properties:
                disposition_id: { type: string }
                receipt_id: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1 }
                grade: { type: string, enum: [A, B, C, SCRAP] }
                outcome: { type: string, enum: [RESTOCK, REFURBISH, LIQUIDATE, DISPOSE, RTV] }
                policy_version: { type: integer, minimum: 1 }
                supersedes: { type: string, nullable: true, description: The disposition this override supersedes; null on a policy decision. }
                reason: { type: string, nullable: true, description: Mandatory on an override; null on a policy decision. }
                decided_at: { type: string, format: date-time }

    ReturnLineStagedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, line_no, sku, quantity, condition, received_at, rma_id, disposition_id, site_id]
              properties:
                receipt_id: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1 }
                condition: { type: string, const: "Good", description: inbound-receiving's ReceiptLineReceived carries this field; a staged return line is always Good. }
                received_at: { type: string, format: date-time, description: When the line arrived on the receipt. }
                rma_id: { type: string, description: The RMA the line was authorized against. }
                disposition_id: { type: string, description: The RESTOCK disposition this staging belongs to; the idempotency key downstream. }
                site_id: { type: string }

    ProductClassifiedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, handling_tags, temperature_class, dot_hazard_class, classification_source, version]
              properties:
                sku: { type: string }
                handling_tags: { type: array, items: { type: string }, description: "e.g. Hazmat, TemperatureSensitive; empty for an untagged SKU." }
                temperature_class: { type: string, description: "Ambient, Chilled, Frozen or the producer's empty default." }
                dot_hazard_class: { type: integer, minimum: 0, description: The DOT hazard class; 0 means the SKU carries no rating. }
                classification_source: { type: string, description: native or imported. }
                version: { type: integer, minimum: 1, description: Per-SKU monotonically increasing; apply only when greater than the stored one. }

    AllocatedLine:
      type: object
      required: [line_no, sku, path_id, gift_wrap, fulfillment_class]
      description: An allocated order line. There is NO quantity on it.
      properties:
        line_no: { type: integer, minimum: 1 }
        sku: { type: string }
        path_id: { type: string }
        gift_wrap: { type: boolean }
        fulfillment_class: { type: string }

    OrderAllocatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [order_id, promise_date, lines]
              properties:
                order_id: { type: string }
                promise_date: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/AllocatedLine" }

    OrderPartiallyAllocatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [order_id, promise_date, lines]
              properties:
                order_id: { type: string }
                promise_date: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  description: ONLY the allocated lines, in the same shape as OrderAllocated.
                  items: { $ref: "#/components/schemas/AllocatedLine" }

    PackageManifestedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [package_id, order_ref]
              properties:
                package_id: { type: string }
                order_ref: { type: string, description: "The WES work unit id {order_id}-line-{line_no}." }
