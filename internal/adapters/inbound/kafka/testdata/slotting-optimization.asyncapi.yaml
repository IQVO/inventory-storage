    ProductPackLevelDeclared:
      name: ProductPackLevelDeclared
      title: ProductPackLevelDeclared (consumed, product-master)
      summary: A pack level of a SKU was declared or revised.
      description: |
        `type` = `com.warehouse.wms.product-master.product.ProductPackLevelDeclared`,
        source `/warehouse/product-master`, dataschema
        `urn:warehouse:product-master:events:ProductPackLevelDeclared:v1`. Subject and key =
        the SKU. Applied to the local PackLevelView (ADR 0012,
        `PACK_LEVEL_MODE=kafka`, group `PACK_LEVEL_CONSUMER_GROUP`) only when
        `version` is greater than the stored one. Payload pinned by
        product-master's `apis/asyncapi.yaml` on `develop`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/ProductPackLevelDeclaredEvent"
    ProductPackLevelRetired:
      name: ProductPackLevelRetired
      title: ProductPackLevelRetired (consumed, product-master)
      summary: A pack level of a SKU was retired.
      description: |
        `type` = `com.warehouse.wms.product-master.product.ProductPackLevelRetired`,
        source `/warehouse/product-master`, dataschema
        `urn:warehouse:product-master:events:ProductPackLevelRetired:v1`. Subject and key =
        the SKU. Applied to the local PackLevelView (ADR 0012,
        `PACK_LEVEL_MODE=kafka`, group `PACK_LEVEL_CONSUMER_GROUP`) only when
        `version` is greater than the stored one. Payload pinned by
        product-master's `apis/asyncapi.yaml` on `develop`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/ProductPackLevelRetiredEvent"
    ProductPackLevelMeasured:
      name: ProductPackLevelMeasured
      title: ProductPackLevelMeasured (consumed, product-master)
      summary: A pack level of a SKU was physically measured.
      description: |
        `type` = `com.warehouse.wms.product-master.product.ProductPackLevelMeasured`,
        source `/warehouse/product-master`, dataschema
        `urn:warehouse:product-master:events:ProductPackLevelMeasured:v1`. Subject and key =
        the SKU. Applied to the local PackLevelView (ADR 0012,
        `PACK_LEVEL_MODE=kafka`, group `PACK_LEVEL_CONSUMER_GROUP`) only when
        `version` is greater than the stored one. Payload pinned by
        product-master's `apis/asyncapi.yaml` on `develop`.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/ProductPackLevelMeasuredEvent"
  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string }
        type: { type: string }
        subject: { type: string, description: The aggregate instance id (the plan id for published events). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        dataschema: { type: string }

    SlotAssignment:
      type: object
      required: [sku, slot]
      properties:
        sku: { type: string }
        slot: { type: string, description: The facility-layout location code of the forward slot. }
        pick_unit: { type: string, enum: [CASE], description: "Additive (ADR 0012). Present only for a CASE-pick face; absent means EACH." }
        cases_capacity: { type: integer, format: int64, minimum: 1, description: "Additive (ADR 0012). Whole cases the CASE-pick face holds; present only with pick_unit CASE." }

    SlotMove:
      type: object
      required: [sku, kind]
      properties:
        sku: { type: string }
        from_slot: { type: string, description: Omitted for an Assign. }
        to_slot: { type: string, description: Omitted for a Vacate. }
        kind: { type: string, enum: [Assign, Relocate, Vacate] }

    SlotPlanGeneratedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [plan_id, site_id, window_from, window_to, policy, assignment_count, move_count, unassigned_count]
              properties:
                plan_id: { type: string }
                site_id: { type: string }
                window_from: { type: string, format: date-time }
                window_to: { type: string, format: date-time, description: Exclusive. }
                policy: { type: string, example: abc-velocity-v1 }
                assignment_count: { type: integer, minimum: 0 }
                move_count: { type: integer, minimum: 0 }
                unassigned_count: { type: integer, minimum: 0 }

    SlotPlanApprovedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [plan_id, site_id, approved_at, assignments, moves]
              properties:
                plan_id: { type: string }
                site_id: { type: string }
                approved_at: { type: string, format: date-time }
                supersedes_plan_id: { type: string, description: Omitted when the site had no Approved plan. }
                assignments:
                  type: array
                  description: The FULL assignment map of the plan.
                  items: { $ref: "#/components/schemas/SlotAssignment" }
                moves:
                  type: array
                  items: { $ref: "#/components/schemas/SlotMove" }

    SlotPlanRejectedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [plan_id, site_id, rejected_at]
              properties:
                plan_id: { type: string }
                site_id: { type: string }
                rejected_at: { type: string, format: date-time }
                reason: { type: string, maxLength: 500, description: Omitted when none was given. }

    SiteSkuDemandChangedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [source_order_id, line_no, site_id, sku, demanded_units, due_at, state, assignment_version]
              properties:
                source_order_id: { type: string }
                line_no: { type: integer, minimum: 1 }
                site_id: { type: string }
                sku: { type: string }
                demanded_units: { type: integer, minimum: 1 }
                due_at: { type: string, format: date-time }
                state: { type: string, enum: [ACTIVE, REMOVED] }
                assignment_version: { type: string, enum: [static-site-v1] }

    HandlingTag:
      type: string
      enum: [Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue]

    ProductClassifiedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, handling_tags, classification_source, version]
              properties:
                sku: { type: string }
                handling_tags:
                  type: array
                  items: { $ref: "#/components/schemas/HandlingTag" }
                temperature_class: { type: string, enum: [Ambient, Chilled, Frozen] }
                dot_hazard_class: { type: integer, minimum: 1, maximum: 9 }
                classification_source: { type: string, enum: [native, legacy-import] }
                version: { type: integer, minimum: 1 }

    Dimensions:
      type: object
      required: [length_mm, width_mm, height_mm, weight_g, volume_mm3]
      properties:
        length_mm: { type: integer, minimum: 1 }
        width_mm: { type: integer, minimum: 1 }
        height_mm: { type: integer, minimum: 1 }
        weight_g: { type: integer, minimum: 1 }
        volume_mm3: { type: integer, minimum: 1 }

    PhysicalProfileEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, effective_source, version]
              properties:
                sku: { type: string }
                declared: { $ref: "#/components/schemas/Dimensions" }
                measured: { type: object, description: Measured dimensions plus measured_at and an optional device_id (ignored here). }
                effective: { $ref: "#/components/schemas/Dimensions" }
                effective_source: { type: string, enum: [measured, declared, none] }
                discrepancy: { type: boolean }
                version: { type: integer, minimum: 1 }

    ZoneRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [zoneId, siteCode, areaCode, zoneCode, temperatureClass, hazmat]
              properties:
                zoneId: { type: string }
                siteCode: { type: string }
                areaCode: { type: string }
                zoneCode: { type: string }
                temperatureClass: { type: string, enum: [Ambient, Chilled, Frozen] }
                hazmat: { type: boolean }

    LocationSlotRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [locationCode, aisleId, zoneId, locationType, maxWeightKg, maxVolumeM3]
              properties:
                locationCode: { type: string }
                aisleId: { type: string }
                zoneId: { type: string }
                locationType: { type: string }
                role: { type: string, description: Absent means Storage. }
                dockFlow: { type: string }
                activities: { type: array, items: { type: string } }
                maxWeightKg: { type: number }
                maxVolumeM3: { type: number }

    LocationSlotDecommissionedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [locationCode]
              properties:
                locationCode: { type: string }

    StockRelocatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [relocation_id, site_code, sku, from_bin, to_bin, quantity, reason, source_ref, occurred_at]
              properties:
                relocation_id: { type: string, description: "The relocation id; recorded once per id." }
                site_code: { type: string, description: The site both bins belong to (this service's site id). }
                sku: { type: string }
                from_bin: { type: string }
                to_bin: { type: string }
                quantity: { type: integer, minimum: 1 }
                reason: { type: string, enum: [SLOTTING, CONSOLIDATION, MANUAL, REPLENISHMENT], description: "Only SLOTTING can execute a slot-plan move; every other reason (including REPLENISHMENT, added by pick-face-replenishment's REPLENISH tasks) is recorded as unmatched with reason=reason-not-slotting." }
                source_ref:
                  type: string
                  maxLength: 200
                  description: "`<plan_id>:<move_seq>` on slot-plan moves (matched first); a task id, a ticket or \"\" otherwise."
                occurred_at: { type: string, format: date-time }
    ProductPackLevelDeclaredEvent:
      type: object
      description: CloudEvents 1.0 envelope of product-master's ProductPackLevelDeclared, as consumed here.
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wms.product-master.product.ProductPackLevelDeclared"
            dataschema:
              const: "urn:warehouse:product-master:events:ProductPackLevelDeclared:v1"
            data:
              type: object
              required: [sku, level, gtin, units_per_pack, is_orderable, is_despatch_unit, effective_from, version]
              properties:
                sku:
                  type: string
                level:
                  type: string
                gtin:
                  type: string
                child_gtin:
                  type: string
                qty_of_child:
                  type: integer
                  minimum: 2
                  description: Absent for EACH.
                units_per_pack:
                  type: integer
                  minimum: 1
                  description: Direct factor to eaches; 1 for EACH.
                is_orderable:
                  type: boolean
                is_despatch_unit:
                  type: boolean
                effective_from:
                  type: string
                  format: date-time
                version:
                  type: integer
                  minimum: 1
    ProductPackLevelRetiredEvent:
      type: object
      description: CloudEvents 1.0 envelope of product-master's ProductPackLevelRetired, as consumed here.
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wms.product-master.product.ProductPackLevelRetired"
            dataschema:
              const: "urn:warehouse:product-master:events:ProductPackLevelRetired:v1"
            data:
              type: object
              required: [sku, level, gtin, effective_to, reason, version]
              properties:
                sku:
                  type: string
                level:
                  type: string
                gtin:
                  type: string
                effective_to:
                  type: string
                  format: date-time
                reason:
                  type: string
                version:
                  type: integer
                  minimum: 1
    ProductPackLevelMeasuredEvent:
      type: object
      description: CloudEvents 1.0 envelope of product-master's ProductPackLevelMeasured, as consumed here.
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type:
              const: "com.warehouse.wms.product-master.product.ProductPackLevelMeasured"
            dataschema:
              const: "urn:warehouse:product-master:events:ProductPackLevelMeasured:v1"
            data:
              type: object
              required: [sku, level, gtin, dims, measured_at, version]
              properties:
                sku:
                  type: string
                level:
                  type: string
                gtin:
                  type: string
                dims:
                  type: object
                  required: [length_mm, width_mm, height_mm, weight_g]
                  properties:
                    length_mm:
                      type: integer
                      minimum: 1
                      maximum: 20000
                    width_mm:
                      type: integer
                      minimum: 1
                      maximum: 20000
                    height_mm:
                      type: integer
                      minimum: 1
                      maximum: 20000
                    weight_g:
                      type: integer
                      minimum: 1
                      maximum: 2000000
                measured_at:
                  type: string
                  format: date-time
                device_id:
                  type: string
                  description: Omitted for a manual measurement.
                version:
                  type: integer
                  minimum: 1
