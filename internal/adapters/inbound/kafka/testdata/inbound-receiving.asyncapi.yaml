        `type` = `com.warehouse.wms.inbound-receiving.receipt.ReceivingAdviceOverdue`;
        subject = the receipt id, key = the ASN number. Raised by the housekeeping
        sweep exactly once per receipt that is still Open when
        `last_carton_at + sla_seconds` (`due_at`) is in the past. It does not stop
        the receipt: closing it later still issues the advice, with `within_sla`
        false. `overdue_at` (the CloudEvents `time`) is when the sweep saw it.
      contentType: application/cloudevents+json
      tags:
        - name: receipt
      payload:
        $ref: "#/components/schemas/ReceivingAdviceOverdueEvent"
      examples:
        - name: example
          payload:
            specversion: "1.0"
            id: "8d2e0f4a-6b3c-4d9e-af10-2b3c4d5e6f77"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.receipt.ReceivingAdviceOverdue"
            subject: "rcpt-223e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-10T10:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:ReceivingAdviceOverdue:v1"
            data:
              receipt_id: "rcpt-223e4567-e89b-12d3-a456-426614174000"
              asn_number: "ASN-1001"
              last_carton_at: "2026-10-09T09:10:00Z"
              due_at: "2026-10-10T09:10:00Z"
              sla_seconds: 86400
              overdue_at: "2026-10-10T10:00:00Z"

