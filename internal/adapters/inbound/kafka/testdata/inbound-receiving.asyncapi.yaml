  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string }
        type: { type: string }
        subject: { type: string, description: The aggregate instance id. }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        dataschema: { type: string }

    AsnLineData:
      type: object
      required: [line_no, sku, expected_qty]
      properties:
        line_no: { type: integer, minimum: 1 }
        sku: { type: string }
        expected_qty: { type: integer, minimum: 1 }

    DiscrepancyData:
      type: object
      required: [line_no, sku, kind, expected_qty, received_qty, damaged_qty]
      properties:
        line_no: { type: integer, minimum: 1 }
        sku: { type: string }
        kind: { type: string, enum: [Short, Over, Damaged] }
        expected_qty: { type: integer, minimum: 1 }
        received_qty: { type: integer, minimum: 0, description: Good plus damaged. }
        damaged_qty: { type: integer, minimum: 0 }
        w13_code: { type: string, enum: ["01", "02", "03"], description: "X12 W13 receiving condition code of the kind (ADR 0023): Damaged 01, Short 02, Over 03." }
        cbv_disposition: { type: string, enum: [damaged, mismatch_quantity], description: "GS1 CBV disposition of the kind (ADR 0023)." }

    ASNRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [asn_number, supplier_ref, lines]
              properties:
                asn_number: { type: string }
                supplier_ref: { type: string }
                registered_at: { type: string, format: date-time, description: When the ASN was registered here (ADR 0025); omitted on events raised before it existed. }
                expected_arrival: { type: string, format: date-time, description: Omitted when the supplier gave none. }
                owner_ref: { type: string, description: Optional opaque tenant tag. }
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/AsnLineData" }
                cartons:
                  type: array
                  description: Optional announced cartons.
                  items:
                    type: object
                    required: [sscc, kind, contents]
                    properties:
                      sscc: { type: string }
                      parent_sscc: { type: string }
                      kind: { type: string, enum: [HOMOGENEOUS_CASE, MIXED] }
                      gross_weight_g: { type: integer }
                      dims:
                        type: object
                        properties:
                          length_mm: { type: integer }
                          width_mm: { type: integer }
                          height_mm: { type: integer }
                      contents:
                        type: array
                        items:
                          type: object
                          required: [line_no, sku, gtin, qty]
                          properties:
                            line_no: { type: integer }
                            sku: { type: string }
                            gtin: { type: string }
                            qty: { type: integer, description: Eaches. }
                            lot: { type: string }
                            expiry: { type: string }

    ASNCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [asn_number]
              properties:
                asn_number: { type: string }
                reason: { type: string, description: Omitted when none was given. }

    AsnLateForArrivalEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [asn_number, supplier_ref, appointment_id, visit_id, asn_registered_at, arrived_at, lateness_seconds]
              properties:
                asn_number: { type: string }
                supplier_ref: { type: string }
                appointment_id: { type: string, description: The appointment the receipt was opened from. }
                visit_id: { type: string, description: The yard visit whose arrival was the earliest seen for the appointment. }
                asn_registered_at: { type: string, format: date-time, description: When the ASN was registered here (ADR 0025). }
                arrived_at: { type: string, format: date-time, description: The earliest gate arrival seen for the appointment (the `visit_arrivals` local copy, ADR 0021). }
                lateness_seconds: { type: integer, format: int64, minimum: 1, description: "`asn_registered_at - arrived_at`, whole seconds; an equal or earlier registration is on time and raises nothing." }

    DockSchedulingAppointmentBookedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              description: The fields this service reads; others are ignored.
              required: [appointment_id, direction, door_code, carrier, window_start, window_end, version]
              properties:
                appointment_id: { type: string }
                direction: { type: string, enum: [INBOUND, OUTBOUND], description: "Only INBOUND is copied." }
                door_code: { type: string }
                carrier: { type: string }
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
                asn_numbers:
                  type: array
                  description: At least one for an INBOUND appointment.
                  items: { type: string }
                version: { type: integer, format: int64, minimum: 1, description: "dock-scheduling's aggregate version; the version guard of the copy." }

    DockSchedulingAppointmentCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              description: The fields this service reads; others are ignored.
              required: [appointment_id, version]
              properties:
                appointment_id: { type: string }
                version: { type: integer, format: int64, minimum: 1 }

    DockSchedulingAppointmentRescheduledEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              description: dock-scheduling's payload; only `appointment_id`, `door_code`, `window_start`, `window_end` and `version` change the copy.
              required: [appointment_id, door_code, window_start, window_end, version]
              properties:
                appointment_id: { type: string }
                site_id: { type: string, description: Ignored. }
                door_code: { type: string, description: The new door. }
                previous_door_code: { type: string, description: Logged only. }
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time, description: Must be after `window_start`. }
                previous_window_start: { type: string, format: date-time, description: Ignored. }
                previous_window_end: { type: string, format: date-time, description: Ignored. }
                arrival_tolerance_minutes: { type: integer, description: Ignored. }
                version: { type: integer, format: int64, minimum: 1, description: "dock-scheduling's aggregate version; the version guard of the copy." }

    DockSchedulingAppointmentDoorReassignedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              description: dock-scheduling's payload; only `appointment_id`, `to_door_code` and `version` change the copy.
              required: [appointment_id, to_door_code, version]
              properties:
                appointment_id: { type: string }
                site_id: { type: string, description: Ignored. }
                from_door_code: { type: string, description: Logged only. }
                to_door_code: { type: string, description: The new door. }
                version: { type: integer, format: int64, minimum: 1 }

    ReceiptOpenedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, opened_at]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                appointment_id: { type: string, description: Omitted for a walk-in delivery. }
                door_code: { type: string, description: Omitted when the receipt has no appointment. }
                opened_at: { type: string, format: date-time }

    ReceiptLineReceivedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, line_no, sku, quantity, condition, received_at]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1 }
                condition: { type: string, enum: [Good, Damaged] }
                received_at: { type: string, format: date-time }
                owner_ref: { type: string, description: Optional; omitted for fleet-owned stock. }
                pack_gtin: { type: string, description: Optional; the CASE GTIN when received as cases or from a homogeneous carton. }
                cases: { type: integer, minimum: 1, description: Optional; cases booked; `quantity` stays eaches. }
                sscc: { type: string, description: Optional; the carton the quantity came from. }

    ReceiptCartonReceivedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, sealed, lpn, contents, received_at]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                owner_ref: { type: string, description: Omitted for fleet-owned stock. }
                sscc: { type: string, description: Omitted for an unlabelled carton. }
                parent_sscc: { type: string }
                sealed: { type: boolean }
                lpn: { type: string, description: "The SSCC, or an internal `LPN-<ulid>`." }
                contents:
                  type: array
                  items:
                    type: object
                    required: [line_no, sku, gtin, qty, condition]
                    properties:
                      line_no: { type: integer, minimum: 1 }
                      sku: { type: string }
                      gtin: { type: string }
                      qty: { type: integer, minimum: 1, description: Eaches. }
                      lot: { type: string }
                      expiry: { type: string }
                      condition: { type: string, enum: [Good, Damaged] }
                received_at: { type: string, format: date-time }
                sscc_source: { type: string, enum: [supplier, receiver], description: "Who gave the carton its SSCC (ADR 0024). `receiver` is an SSCC assigned by AssignSscc under the receiver's own GS1 company prefix. Additive and optional." }
                best_before: { type: string, format: date, description: "AI 15 of the scanned label, as an ISO date; a day 00 is the last day of the month (ADR 0024). Optional." }
                expiry: { type: string, format: date, description: "AI 17 of the scanned label (ADR 0024). Optional." }
                production_date: { type: string, format: date, description: "AI 11 of the scanned label (ADR 0024). Optional." }
                packaging_date: { type: string, format: date, description: "AI 13 of the scanned label (ADR 0024). Optional." }
                serial: { type: string, description: "AI 21 of the scanned label (ADR 0024). Optional." }
                purchase_order: { type: string, description: "AI 400 of the scanned label (ADR 0024). Optional." }
                ship_to_gln: { type: string, pattern: '^[0-9]{13}$', description: "AI 410 of the scanned label (ADR 0024). Optional." }
                ship_for_gln: { type: string, pattern: '^[0-9]{13}$', description: "AI 413 of the scanned label; stored, never enforced (ADR 0024). Optional." }

    CartonDiscrepancyRaisedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, kind, at]
              properties:
                receipt_id: { type: string }
                sscc: { type: string, description: Omitted when the finding has no SSCC. }
                kind:
                  type: string
                  enum: [UnexpectedCarton, MissingCarton, DuplicateSscc, UnknownGtin, CaseQtyMismatch, MixedCaseDeclaredAsCasePack, UnlabelledCarton, CartonOverLimit, MixedCartonContentMismatch, LabelNonCompliant, WrongDestination]
                expected: { type: string, description: "A count, a SKU, or `sku:qty` / `grossWeightG:<n>` pairs (CartonOverLimit: the breached limits; MixedCartonContentMismatch: the manifest; LabelNonCompliant: the reason code, e.g. `conflicting_ais`)." }
                actual: { type: string, description: "The counterpart of `expected` (LabelNonCompliant: the raw scan; WrongDestination: the GLN the label named)." }
                at: { type: string, format: date-time }
                w13_code: { type: string, enum: ["01", "02", "03", "05", "09"], description: "X12 W13 receiving condition code (ADR 0023). Absent when the standard has no code for the kind (LabelNonCompliant and WrongDestination have none)." }
                cbv_disposition: { type: string, description: "GS1 CBV disposition (ADR 0023, 0024), derived from the kind." }
                supplier_ref: { type: string, description: "The supplier of the ASN; set on LabelNonCompliant and WrongDestination so a first-pass rate can be told per supplier (ADR 0024). Optional." }

    ReceiptClosedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, closed_at, discrepancies]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                closed_at: { type: string, format: date-time }
                discrepancies:
                  type: array
                  description: Empty when everything matched.
                  items: { $ref: "#/components/schemas/DiscrepancyData" }

    ReceivingAdviceIssuedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, despatch_advice_ref, supplier_ref, issued_at, last_carton_at, sla_seconds, within_sla, lines, lines_total, carton_findings, carton_findings_total]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                despatch_advice_ref: { type: string, description: "The reference to the despatch advice: the ASN number." }
                supplier_ref: { type: string, description: "The supplier as the ASN knows it." }
                owner_ref: { type: string, description: "The 3PL depositor. Omitted for fleet-owned stock." }
                issued_at: { type: string, format: date-time }
                last_carton_at: { type: string, format: date-time, description: "When the last unit was received; the receipt's opening when nothing was." }
                sla_seconds: { type: integer, format: int64, minimum: 1, description: "The committed window (RECEIVING_ADVICE_SLA) in force at close." }
                within_sla: { type: boolean, description: "issued_at - last_carton_at <= sla_seconds." }
                lines:
                  type: array
                  maxItems: 1000
                  description: Lines with exceptions first, then the rest, each group in line order; bounded.
                  items:
                    type: object
                    required: [line_no, sku, expected_qty, received_qty, accepted_qty, rejected_qty, held_qty, sscc_count, discrepancies]
                    properties:
                      line_no: { type: integer, minimum: 1 }
                      sku: { type: string }
                      gtin: { type: string, pattern: '^[0-9]{14}$', description: Omitted when the line has no known GTIN. }
                      expected_qty: { type: integer, minimum: 0 }
                      received_qty: { type: integer, minimum: 0, description: "Accepted plus rejected plus held." }
                      accepted_qty: { type: integer, minimum: 0, description: The Good units that are not held. }
                      rejected_qty: { type: integer, minimum: 0, description: The Damaged units. }
                      held_qty: { type: integer, minimum: 0, description: "The Good units declared held by the Hold command." }
                      sscc_count: { type: integer, minimum: 0, description: The real number of SSCCs received on the line. }
                      ssccs:
                        type: array
                        maxItems: 1000
                        items: { type: string, pattern: '^[0-9]{18}$' }
                      ssccs_truncated: { type: boolean, description: "True when ssccs lists fewer than sscc_count. Omitted when false." }
                      earliest_best_before: { type: string, format: date, description: "The earliest best-before date (AI 15) of the accepted cartons of the line (ADR 0024). Omitted when none carried one." }
                      earliest_expiry: { type: string, format: date, description: "The earliest expiry date (AI 17) of the accepted cartons of the line (ADR 0024). Omitted when none carried one." }
                      discrepancies:
                        type: array
                        items:
                          type: object
                          required: [kind, quantity, cbv_disposition]
                          properties:
                            kind: { type: string, enum: [Short, Over, Damaged, IncorrectProduct, Hold] }
                            quantity: { type: integer, minimum: 1 }
                            w13_code: { type: string, enum: ["01", "02", "03", "05", "09"] }
                            cbv_disposition: { type: string, enum: [damaged, mismatch_quantity, mismatch_class, non_conformant] }
                lines_total: { type: integer, minimum: 0, description: The real number of lines. }
                lines_truncated: { type: boolean, description: "True when lines lists fewer than lines_total. Omitted when false." }
                carton_findings:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [kind, at]
                    properties:
                      kind: { type: string }
                      sscc: { type: string }
                      expected: { type: string }
                      actual: { type: string }
                      at: { type: string, format: date-time }
                      w13_code: { type: string, enum: ["01", "02", "03", "05", "09"], description: Absent for a kind with no W13 code. }
                      cbv_disposition: { type: string }
                      supplier_ref: { type: string, description: Set on label findings (ADR 0024). }
                carton_findings_total: { type: integer, minimum: 0 }

    ReceivingAdviceOverdueEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, last_carton_at, due_at, sla_seconds, overdue_at]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                last_carton_at: { type: string, format: date-time }
                due_at: { type: string, format: date-time, description: last_carton_at + sla_seconds. }
                sla_seconds: { type: integer, format: int64, minimum: 1 }
                overdue_at: { type: string, format: date-time, description: When the sweep saw the receipt past due. }

    VisitCheckedInEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              description: The fields this service reads; others are ignored.
              required: [visit_id, arrived_at, version]
              properties:
                visit_id: { type: string }
                appointment_id: { type: [string, "null"], description: "Null for a walk-in visit, which is ignored." }
                arrived_at: { type: string, format: date-time, description: "The gate arrival: the start of dock-to-stock." }
                version: { type: integer, format: int64, minimum: 1 }

    ContainerStowedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              description: The fields this service reads; others are ignored.
              required: [lpn, at]
              properties:
                lpn: { type: string, description: "The license plate; for a receipt carton it is its SSCC." }
                at: { type: string, format: date-time, description: "When the container was stowed." }

    ReceiptStowCompletedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, appointment_id, arrived_at, closed_at, stowed_at, dock_to_stock_seconds, carton_count]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                appointment_id: { type: string }
                arrived_at: { type: string, format: date-time, description: "yard-management's gate arrival." }
                closed_at: { type: string, format: date-time }
                stowed_at: { type: string, format: date-time, description: "The latest stow of a Good carton." }
                dock_to_stock_seconds: { type: integer, format: int64, minimum: 0, description: "stowed_at - arrived_at, clamped at 0." }
                carton_count: { type: integer, minimum: 1, description: "How many Good cartons were stowed." }

    ProductRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, description, version]
              properties:
                sku: { type: string }
                description: { type: string }
                version: { type: integer, minimum: 1 }

    ProductPackLevelDeclaredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, level, gtin, units_per_pack, is_orderable, is_despatch_unit, effective_from, version]
              properties:
                sku: { type: string }
                level: { type: string, enum: [EACH, INNER, CASE, PALLET] }
                gtin: { type: string, pattern: '^[0-9]{14}$' }
                child_gtin: { type: string, pattern: '^[0-9]{14}$' }
                qty_of_child: { type: integer, minimum: 2, maximum: 1000000, description: Absent for EACH. }
                units_per_pack: { type: integer, minimum: 1, maximum: 1000000, description: Direct factor to eaches; 1 for EACH. }
                is_orderable: { type: boolean }
                is_despatch_unit: { type: boolean }
                effective_from: { type: string, format: date-time }
                version: { type: integer, minimum: 1 }
    ProductPackLevelRetiredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, level, gtin, effective_to, reason, version]
              properties:
                sku: { type: string }
                level: { type: string, enum: [EACH, INNER, CASE, PALLET] }
                gtin: { type: string, pattern: '^[0-9]{14}$' }
                effective_to: { type: string, format: date-time }
                reason: { type: string, minLength: 1, maxLength: 200 }
                version: { type: integer, minimum: 1 }

    LocationSlotRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [locationCode, aisleId, zoneId, locationType, maxWeightKg, maxVolumeM3]
              properties:
                eventName: { type: string }
                eventType: { type: string }
                occurredAt: { type: string, format: date-time }
                locationCode: { type: string }
                aisleId: { type: string }
                zoneId: { type: string }
                locationType: { type: string }
                role: { type: string, description: "Storage, Dock, Yard, WorkCenter, Drop, Staging, QC, Consolidation or Shipping; absent means Storage." }
                dockFlow: { type: string, enum: [Inbound, Outbound, Both], description: Present only when role is Dock. }
                activities: { type: array, items: { type: string }, description: Present only when role is WorkCenter. }
                maxWeightKg: { type: number }
                maxVolumeM3: { type: number }

    LocationSlotDecommissionedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [locationCode]
              properties:
                eventName: { type: string }
                eventType: { type: string }
                occurredAt: { type: string, format: date-time }
                locationCode: { type: string }
