    CycleCountCompletedEvent:
      description: CloudEvents envelope for a CycleCountCompleted domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for CycleCountCompleted.
              const: "com.warehouse.wms.inventory-storage.bin.CycleCountCompleted"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:CycleCountCompleted:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:CycleCountCompleted:v1$"
            data:
              type: object
              description: Business payload for CycleCountCompleted.
              required:
                - bin_id
                - counted
                - system
                - discrepancy
              properties:
                bin_id:
                  type: string
                  description: The bin whose contents were verified.
                counted:
                  type: integer
                  minimum: 0
                  description: Quantity physically counted in the bin.
                system:
                  type: integer
                  minimum: 0
                  description: Quantity the system believed was in the bin.
                discrepancy:
                  type: boolean
                  description: >
                    Whether counted and system quantities differed. When true,
                    a DiscrepancyDetected event accompanies this one.

    DiscrepancyDetectedEvent:
      description: CloudEvents envelope for a DiscrepancyDetected domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for DiscrepancyDetected.
              const: "com.warehouse.wms.inventory-storage.bin.DiscrepancyDetected"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:DiscrepancyDetected:v1 on the integration topic, ...:analytics:DiscrepancyDetected:v1 on the analytics topic (ADR 0043).
              pattern: "^urn:warehouse:inventory-storage:(events|analytics):DiscrepancyDetected:v1$"
            data:
              type: object
              description: Business payload for DiscrepancyDetected.
              required:
                - bin_id
                - counted
                - system
              properties:
                bin_id:
                  type: string
                  description: The bin whose count did not match system records.
                counted:
                  type: integer
                  minimum: 0
                  description: Quantity physically counted in the bin.
                system:
                  type: integer
                  minimum: 0
                  description: Quantity the system believed was in the bin.

    TransferStockAllocatedEvent:
      description: CloudEvents envelope for a TransferStockAllocated domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferStockAllocated.
              const: "com.warehouse.wms.inventory-storage.reservation.TransferStockAllocated"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferStockAllocated:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferStockAllocated:v1$"
            data:
              type: object
              description: Business payload for TransferStockAllocated.
              required:
                - transfer_id
                - transfer_line_id
                - origin_site_id
                - reservation_id
                - sku
                - quantity
                - allocations
                - expires_at
              properties:
                transfer_id:
                  type: string
                  description: The planning context's transfer (saga) id.
                transfer_line_id:
                  type: string
                  description: The transfer line this allocation decides; DB-unique in the ledger.
                origin_site_id:
                  type: string
                  description: The site whose custody donated the stock.
                reservation_id:
                  type: string
                  description: The Reservation aggregate now holding the stock.
                sku:
                  type: string
                  description: The stock keeping unit allocated.
                quantity:
                  type: integer
                  minimum: 1
                  description: Total quantity held for the transfer line.
                allocations:
                  type: array
                  minItems: 1
                  description: Per-stock-unit draws with pick locations.
                  items:
                    type: object
                    required:
                      - stock_unit_id
                      - bin_id
                      - quantity
                    properties:
                      stock_unit_id:
                        type: string
                      bin_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                expires_at:
                  type: string
                  format: date-time
                  description: When the holding reservation times out (revocable).

    TransferStockAllocationRejectedEvent:
      description: CloudEvents envelope for a TransferStockAllocationRejected domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferStockAllocationRejected.
              const: "com.warehouse.wms.inventory-storage.reservation.TransferStockAllocationRejected"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferStockAllocationRejected:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferStockAllocationRejected:v1$"
            data:
              type: object
              description: Business payload for TransferStockAllocationRejected.
              required:
                - transfer_id
                - transfer_line_id
                - origin_site_id
                - sku
                - requested_quantity
                - reason
              properties:
                transfer_id:
                  type: string
                transfer_line_id:
                  type: string
                origin_site_id:
                  type: string
                sku:
                  type: string
                requested_quantity:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  enum:
                    - ORIGIN_SITE_UNKNOWN
                    - INSUFFICIENT_USABLE
                    - IDEMPOTENCY_CONFLICT
                  description: >
                    Closed rejection reason set. ORIGIN_SITE_UNKNOWN: no
                    usable stock in the origin site's custody (including
                    legacy site-less stock). INSUFFICIENT_USABLE: origin
                    holds the SKU but not enough usable quantity.
                    IDEMPOTENCY_CONFLICT: the line id was replayed with a
                    different payload; the original decision stands.

    TransferReceiptStagedEvent:
      description: CloudEvents envelope for a TransferReceiptStaged domain event (ADR 0033).
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferReceiptStaged.
              const: "com.warehouse.wms.inventory-storage.stock.TransferReceiptStaged"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferReceiptStaged:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferReceiptStaged:v1$"
            data:
              type: object
              description: >-
                Business payload for TransferReceiptStaged. The receipt is
                STAGED: counted, not yet placed; no usable stock moved.
              required:
                - transfer_id
                - transfer_line_id
                - destination_site_id
                - sku
                - expected_quantity
                - received_quantity
                - variance
              properties:
                transfer_id:
                  type: string
                  description: The planning context's transfer (saga) id.
                transfer_line_id:
                  type: string
                  description: The transfer line this receipt stages; DB-unique in transfer_receipts.
                destination_site_id:
                  type: string
                  description: The receiving site whose dock counted the goods.
                sku:
                  type: string
                  description: The stock keeping unit counted.
                expected_quantity:
                  type: integer
                  minimum: 1
                  description: What the transfer_allocations ledger promised (requested_quantity).
                received_quantity:
                  type: integer
                  minimum: 1
                  description: What was physically counted at the dock.
                variance:
                  type: integer
                  description: >-
                    SIGNED received - expected. Positive = over-receipt,
                    negative = short-receipt, 0 = exact. Explicit, never
                    silently absorbed.

    TransferStockStowedEvent:
      description: CloudEvents envelope for a TransferStockStowed domain event (ADR 0033).
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferStockStowed.
              const: "com.warehouse.wms.inventory-storage.stock.TransferStockStowed"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferStockStowed:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferStockStowed:v1$"
            data:
              type: object
              description: >-
                Business payload for TransferStockStowed. The destination
                site's usable stock rose by exactly received_quantity,
                once, through the StockUnits listed in allocations.
              required:
                - transfer_id
                - transfer_line_id
                - destination_site_id
                - sku
                - received_quantity
                - stowed_quantity
                - allocations
              properties:
                transfer_id:
                  type: string
                transfer_line_id:
                  type: string
                destination_site_id:
                  type: string
                  description: The site whose custody the new StockUnits were created in.
                sku:
                  type: string
                received_quantity:
                  type: integer
                  minimum: 1
                  description: The receipt's counted quantity.
                stowed_quantity:
                  type: integer
                  minimum: 1
                  description: Total quantity placed (equals received_quantity).
                allocations:
                  type: array
                  minItems: 1
                  description: The destination StockUnits created, with the bin each was placed into.
                  items:
                    type: object
                    required:
                      - stock_unit_id
                      - bin_id
                      - quantity
                    properties:
                      stock_unit_id:
                        type: string
                      bin_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1

    StockRelocatedEvent:
      description: CloudEvents envelope for a StockRelocated domain event (ADR 0039).
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for StockRelocated.
              const: "com.warehouse.wms.inventory-storage.stock.StockRelocated"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:StockRelocated:v1
              pattern: "^urn:warehouse:inventory-storage:events:StockRelocated:v1$"
            data:
              type: object
              description: >-
                Business payload for StockRelocated (v1, frozen). `quantity`
                units of `sku` left `from_bin` and are now in `to_bin`, both
                bins of `site_code`.
              required:
                - relocation_id
                - site_code
                - sku
                - from_bin
                - to_bin
                - quantity
                - reason
                - source_ref
                - occurred_at
              properties:
                relocation_id:
                  type: string
                  description: The Relocation's id (GET /relocations/{id}); also the Kafka key and `subject`.
                site_code:
                  type: string
                  description: The site both bins belong to.
                sku:
                  type: string
                from_bin:
                  type: string
                  description: The source bin's location code.
                to_bin:
                  type: string
                  description: The destination bin's location code (never equal to from_bin).
                quantity:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  enum: [SLOTTING, CONSOLIDATION, MANUAL, REPLENISHMENT]
                  description: >-
                    Why the stock moved. A RELOCATE task is always SLOTTING (it
                    executes a slot plan). REPLENISHMENT (additive, ADR 0041) is
                    set only by a completed REPLENISH task (pick-face
                    replenishment) and never accepted from POST /relocations; its
                    source_ref is the replenishment request id. Consumers that
                    act only on SLOTTING must ignore other values.
                source_ref:
                  type: string
                  maxLength: 200
                  description: >-
                    The caller's reference (a slot-plan move, the task's
                    relocation_ref, or the task id; for REPLENISHMENT the
                    replenishment request id, the REPLENISH task's request_ref);
                    always present, "" when none.
                occurred_at:
                  type: string
                  format: date-time

    BinStockLevelChangedEvent:
      description: CloudEvents envelope for a BinStockLevelChanged domain event (ADR 0040).
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for BinStockLevelChanged.
              const: "com.warehouse.wms.inventory-storage.stock.BinStockLevelChanged"
            subject:
              type: string
              description: The Kafka key too, `<bin>:<sku>`.
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:BinStockLevelChanged:v1
              pattern: "^urn:warehouse:inventory-storage:events:BinStockLevelChanged:v1$"
            data:
              type: object
              description: >-
                Business payload for BinStockLevelChanged (v1, frozen).
                `on_hand` and `reserved` are the absolute levels of `sku` in
                `bin` after the change.
              required:
                - site_code
                - bin
                - sku
                - on_hand
                - reserved
                - version
                - reason
                - occurred_at
              properties:
                site_code:
                  type: string
                  description: The site the bin belongs to (recorded custody, else the site segment of its location code).
                bin:
                  type: string
                  description: The bin's location code.
                sku:
                  type: string
                on_hand:
                  type: integer
                  minimum: 0
                  description: Units physically in the bin after the change (located, still-present units).
                reserved:
                  type: integer
                  minimum: 0
                  description: The part of on_hand bound to active reservations (never above on_hand).
                version:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Per-(bin, sku) strictly increasing counter; keep the highest, ignore lower.
                owner_ref:
                  type: string
                  maxLength: 64
                  description: >-
                    Optional (ADR 0045, additive within v1). The owner whose
                    share of the bin this level is; the version counter is per
                    (bin, sku, owner). Omitted for fleet-owned stock, so every
                    event of fleet stock is byte-identical to before.
                reason:
                  type: string
                  enum: [STOW, PICK, RELOCATE, REPLENISHMENT, COUNT, RESERVE, REVOKE, UNLOCATED]
                  description: >-
                    What moved the level. Consumers ignore values they do not
                    know. UNLOCATED is not emitted yet; REPLENISHMENT is emitted by
                    a completed REPLENISH task (ADR 0041).
                occurred_at:
                  type: string
                  format: date-time
