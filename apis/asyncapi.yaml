            dataschema: urn:warehouse:inventory-storage:events:TransferStockStowed:v1
            data:
              transfer_id: tr-77
              transfer_line_id: tl-77-1
              destination_site_id: SITE-DEST
              sku: SKU-T1
              received_quantity: 5
              stowed_quantity: 5
              allocations:
                - stock_unit_id: su-dest-1
                  bin_id: BIN-DEST-1
                  quantity: 3
                - stock_unit_id: su-dest-2
                  bin_id: BIN-DEST-2
                  quantity: 2

    StockRelocated:
      name: StockRelocated
      title: Stock Relocated
      summary: A quantity of one SKU moved from one bin to another bin of the same site — on hand unchanged, location changed, exactly once.
      description: >-
        Raised by the RelocateStock use case (ADR 0039), reached two ways:
        POST /relocations (Idempotency-Key) and the RELOCATE branch of the
        TaskCompleted consumer (a completed slot-plan RELOCATE task from
        fulfillment-execution). In ONE transaction the source bin's
        occupancy fell and the destination bin's rose by `quantity`, the
        touched source StockUnits were decremented, ONE new StockUnit was
        created at `to_bin`, the immutable `relocations` row was written and
        this outbox row enqueued. Site-level on-hand is unchanged.


        Exactly once per relocation: a replayed POST returns the stored
        response and a redelivered TaskCompleted (same CloudEvents id) is a
        no-op, so neither publishes again. `source_ref` is always present
        (`""` when none); on the task path it is the task's
        `relocation_ref`, or its task id when the producer sent none. A
        completed REPLENISH task (ADR 0041) reaches the same use case with
        reason `REPLENISHMENT` and `source_ref` = the task's `request_ref`
        (the replenishment request id; required, no task-id fallback), which
        pick-face-replenishment matches to complete its request.


        **Integration topic only** (no analytics variant). Kafka key and
        CloudEvents `subject` are the relocation id (ADR 0021).
        slotting-optimization consumes it to close a slot plan's move; it must
        act only on `reason = SLOTTING`.
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised on the intra-site relocation path (ADR 0039).
      payload:
        $ref: "#/components/schemas/StockRelocatedEvent"
      examples:
        - name: replenishmentFromATask
          summary: Twelve units of SKU-R1 moved from a reserve bin to the pick face by a completed REPLENISH task (ADR 0041).
          payload:
            specversion: "1.0"
            id: 4d0f2b63-8c5e-4f29-b7a3-6e1c9d8f0a32
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.StockRelocated
            subject: rel-45
            time: "2026-10-17T12:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:StockRelocated:v1
            data:
              relocation_id: rel-45
              site_code: WH1
              sku: SKU-R1
              from_bin: WH1-STOR-AMB-A01-01-01-A
              to_bin: WH1-PICK-AMB-A02-01-01-A
              quantity: 12
              reason: REPLENISHMENT
              source_ref: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
              occurred_at: "2026-10-17T12:00:00Z"
        - name: slottingMoveFromATask
          summary: Seven units of SKU-R1 moved between two WH1 bins by a completed RELOCATE task.
          payload:
            specversion: "1.0"
            id: 3c9e1a52-7b4d-4e18-a6f2-5d0b8c7e9f21
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.StockRelocated
            subject: rel-42
            time: "2026-10-13T12:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:StockRelocated:v1
            data:
              relocation_id: rel-42
              site_code: WH1
              sku: SKU-R1
              from_bin: WH1-STOR-AMB-A01-01-01-A
              to_bin: WH1-STOR-AMB-A02-01-01-A
              quantity: 7
              reason: SLOTTING
              source_ref: plan-9#3
              occurred_at: "2026-10-13T12:00:00Z"

    BinStockLevelChanged:
      name: BinStockLevelChanged
      title: Bin Stock Level Changed
      summary: The absolute stock level of one SKU in one bin after a ledger change — on hand, reserved, and a per-(bin, sku) version.
      description: >-
        Raised from the SAME transaction as every ledger change that moves
        the level of a SKU in a bin (ADR 0040), through the transactional
        outbox: stow and transfer stow (`STOW`), a confirmed pick (`PICK`), a
        relocation or RELOCATE task (`RELOCATE`: two events, the source bin
        then the destination bin), a cycle-count shortfall (`COUNT`), a
        reservation or transfer allocation (`RESERVE`), and a revoked or
        expired reservation (`REVOKE`). One event per distinct (bin, sku) per
        transaction, carrying the FINAL level after the whole transaction: an
        order whose lines pick the same (bin, sku) raises it once. Nothing is
        raised when the level did not change (idempotent replays, rejected
        commands).


        `on_hand` and `reserved` are ABSOLUTE levels after the change, never
        deltas. `on_hand` is the quantity physically in the bin as the ledger
        sees it (located, still-present units: units a cycle count marked
        unlocated, and fully picked-out units, are not counted);
        `reserved` is the part of it bound to active reservations, so
        `on_hand - reserved` is what a new reservation could still draw from
        the bin. `version` is the persisted per-(bin, sku) counter, strictly
        increasing and gapless across restarts and concurrent changes: a
        consumer keeps the highest version it has seen for a (bin, sku) and
        ignores any lower one.


        `reason` is `STOW`, `PICK`, `RELOCATE`, `REPLENISHMENT`, `COUNT`,
        `RESERVE`, `REVOKE` or `UNLOCATED`; consumers ignore values they do not
        know. `REPLENISHMENT` is the reason of a relocation made by a completed
        REPLENISH task (ADR 0041: two events, the source bin then the
        destination bin, like RELOCATE), and `UNLOCATED` is reserved for an
        unlocated receive with a bin: it is not emitted today (a receive names
        no bin).
        A bin whose site cannot be determined (not registered, or neither a
        recorded site custody nor a facility-layout location code) raises no
        event. Stock owned by a seller (ADR 0045) has its own level per
        owner: the optional `owner_ref` names it and the `version` counter is
        per (bin, sku, owner); a consumer that ignores `owner_ref` sees
        interleaved levels, so it should key on (bin, sku, owner_ref).


        **Integration topic only** (no analytics variant). Kafka key and
        CloudEvents `subject` are `<bin>:<sku>`, so every level of one pair
        lands on one partition in version order (ADR 0021).
        pick-face-replenishment consumes it to detect a forward pick slot
        below its minimum.
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised by every ledger change that moves a bin level (ADR 0040).
      payload:
        $ref: "#/components/schemas/BinStockLevelChangedEvent"
      examples:
        - name: pickLeavesTheForwardSlotLow
          summary: A confirmed pick left 12 units of SKU-1 in a forward bin, 5 of them reserved.
          payload:
            specversion: "1.0"
            id: 0b7c4a1e-2f3d-4e5a-8b6c-7d8e9f0a1b2c
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.BinStockLevelChanged
            subject: WH1-STOR-AMB-A01-01-01-A:SKU-1
            time: "2026-08-21T22:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:BinStockLevelChanged:v1
            data:
              site_code: WH1
              bin: WH1-STOR-AMB-A01-01-01-A
              sku: SKU-1
              on_hand: 12
              reserved: 5
              version: 7
              reason: PICK
              occurred_at: "2026-08-21T22:00:00Z"

    ReservationExpired:
      name: ReservationExpired
      title: Reservation Expired
      summary: A reservation's timeout elapsed before pick confirmation.
      description: >
        Describes a reservation that timed out without being confirmed or
        revoked, so its quantity returns to usable. Raised lazily: the
        Reservation aggregate's `IsExpired`/`Expire()` are invoked the next
        time the reservation is read (GetReservationsByDemandRef,
        RevokeReservation, ConfirmPick, or ReserveStock's own idempotency
        lookup), not by a background sweeper — see ADR 0003's "Lazy expiry"
        section for the full rationale.


        Published to `warehouse.inventory.analytics` only (subject = Kafka
        key = reservation id), with the reservation's SKU enriched in:
        analytics `data` is `{reservation_id, sku}`. It does not cross to the
        integration topic.
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Raised by the Reservation aggregate.
      payload:
        $ref: "#/components/schemas/ReservationExpiredEvent"
      examples:
        - name: reservationTimedOut
          summary: Reservation res-9 timed out before its pick was confirmed.
          payload:
            specversion: "1.0"
            id: 6d1c8b45-2e70-4f39-9a5b-c0e7d2f14b36
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.ReservationExpired
            subject: res-9
            time: "2026-08-21T22:30:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:ReservationExpired:v1
            data:
              reservation_id: res-9
              sku: SKU-1

    ReservationRevoked:
      name: ReservationRevoked
      title: Reservation Revoked
      summary: A reservation was cancelled and its quantity returned to usable.
      description: >
        Raised by the RevokeReservation use case. Revocation is the mechanism
        that keeps a physical failure — a blocked pod, a lost tote, a chute
        jam, a short pick — from stranding an order: the quantity goes back to
        usable and the demand can be re-allocated against a different holding.


        **Published to both topics.** On `warehouse.inventory.events`
        (dataschema `urn:warehouse:inventory-storage:events:ReservationRevoked:v1`)
        the domain event carries only the reservation id, so the adapter
        enriches it through `ports.ReservationRepo` and emits the same
        `sku` / `quantity` / `demand_ref` shape as StockReserved; if the
        lookup finds nothing the publish fails rather than emitting a partial
        payload. The reservation id is the `subject` and the Kafka key.
        wes-work-planning consumes this exact `type`. On
        `warehouse.inventory.analytics` `data` is `{reservation_id, sku}`.
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Raised by the Reservation aggregate.
      payload:
        $ref: "#/components/schemas/ReservationRevokedEvent"
      examples:
        - name: revokedAfterShortPick
          summary: Reservation res-1 revoked, returning five units of SKU-1 to usable.
          payload:
            specversion: "1.0"
            id: 4b9e2f61-7c3a-4d08-85e2-1a6f9c0d3b72
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.ReservationRevoked
            subject: res-1
            time: "2026-08-21T22:10:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:ReservationRevoked:v1
            data:
              sku: SKU-1
              quantity: 5
              demand_ref: order-42

    StockPicked:
      name: StockPicked
      title: Stock Picked
      summary: Reserved quantity was physically removed from its bin.
      description: >
        Raised by the ConfirmPick use case. It consumes the reservation — a
        reservation cannot be double-consumed — and permanently removes the
        quantity from on-hand. Grouped under the `reservation` entity segment
        because the reservation id is the only identity the event carries.


        Published to `warehouse.inventory.analytics` only (subject = reservation id, Kafka key = reservation id — ADR 0021). Analytics `data`: `{sku, reservation_id, quantity}`.
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Raised by the Reservation aggregate.
      payload:
        $ref: "#/components/schemas/StockPickedEvent"
      examples:
        - name: pickConfirmed
          summary: Reservation res-1 consumed; five units of SKU-1 picked.
          payload:
            specversion: "1.0"
            id: 9a3c7e52-1d84-4b60-92f7-5e8b0c4a6d13
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.StockPicked
            subject: res-1
            time: "2026-08-21T22:12:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:StockPicked:v1
            data:
              reservation_id: res-1
              sku: SKU-1
              quantity: 5

    ItemUnlocated:
      name: ItemUnlocated
      title: Item Unlocated
      summary: A physical item's bin is no longer known — the stock is lost.
      description: >
        Raised by the RunCycleCount use case when a count comes up short: the
        quantity the system believed was in the bin is not there, so the
        affected StockUnit quantity is flagged Unlocated and removed from
        usable. This is the explicit escape hatch for the "every item has
        exactly one known bin" rule.


        **Published to both topics** (promoted to the integration topic
        2026-10-21, ADR 0043, for exception-management). Subject = stock
        unit id, Kafka key = SKU on both topics (the split the analytics
        publisher always used: every fact about one SKU's units stays on
        one partition while the subject names the lost unit); `data` is
        byte-identical: `{sku, bin_id, stock_unit_id, quantity}`. Only the
        `dataschema` stream differs.
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised by the StockUnit aggregate.
      payload:
        $ref: "#/components/schemas/ItemUnlocatedEvent"
      examples:
        - name: shortCountUnlocatedStock
          summary: Three units of SKU-1001 could not be found in bin A-12-3.
          payload:
            specversion: "1.0"
            id: 7e0d5a83-4f19-42b7-a3c6-8b1e9d2f0c45
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.ItemUnlocated
            subject: su-7781
            time: "2026-08-21T23:00:02Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:ItemUnlocated:v1
            data:
              stock_unit_id: su-7781
              sku: SKU-1001
              bin_id: A-12-3
              quantity: 3

    CycleCountCompleted:
      name: CycleCountCompleted
      title: Cycle Count Completed
      summary: A bin's contents were verified against system records.
      description: >
        Raised by the RunCycleCount use case once a bin has been counted and
        reconciled. The `discrepancy` flag says whether the counted quantity
        matched the system quantity; when it did not, a DiscrepancyDetected
        event and possibly ItemUnlocated events are emitted alongside this
        one.


        Published to `warehouse.inventory.analytics` only (subject = bin id, Kafka key = bin id). Analytics `data`: `{bin_id, counted, system, discrepancy}`.
      contentType: application/cloudevents+json
      tags:
        - name: bin
          description: Raised by the Bin/Location aggregate.
      payload:
        $ref: "#/components/schemas/CycleCountCompletedEvent"
      examples:
        - name: countMatchedSystem
          summary: Bin A-12-3 counted at 50 units, matching the system record.
          payload:
            specversion: "1.0"
            id: 3f8b6d24-0a57-4e93-b1d8-6c2f7a9e4051
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.bin.CycleCountCompleted
            subject: A-12-3
            time: "2026-08-21T23:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:CycleCountCompleted:v1
            data:
              bin_id: A-12-3
              counted: 50
              system: 50
              discrepancy: false

    DiscrepancyDetected:
      name: DiscrepancyDetected
      title: Discrepancy Detected
      summary: A cycle count found system records did not match physical reality.
      description: >
        Raised by the RunCycleCount use case when the counted quantity differs
        from the system quantity for a bin, before reconciliation is applied.
        A shortfall additionally produces ItemUnlocated events for the
        quantity that could not be found.


        **Published to both topics** (promoted to the integration topic
        2026-10-21, ADR 0043, for exception-management). Subject = Kafka
        key = bin id on both topics; `data` is byte-identical:
        `{bin_id, counted, system}`. Only the `dataschema` stream differs.
      contentType: application/cloudevents+json
      tags:
        - name: bin
          description: Raised by the Bin/Location aggregate.
      payload:
        $ref: "#/components/schemas/DiscrepancyDetectedEvent"
      examples:
        - name: binCountShort
          summary: Bin A-12-3 counted at 47 units against a system record of 50.
          payload:
            specversion: "1.0"
            id: c2a90b76-8e34-4f51-9d07-4b6e1c8a37f9
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.bin.DiscrepancyDetected
            subject: A-12-3
            time: "2026-08-21T23:00:01Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:DiscrepancyDetected:v1
            data:
              bin_id: A-12-3
              counted: 47
              system: 50

  schemas:
    CloudEventBase:
      type: object
      description: >
        The CloudEvents 1.0 context attributes shared by every message this
        bounded context emits, in structured-mode JSON. Each concrete event
        schema composes this with `allOf` and pins `type` to a single value.
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - dataschema
        - data
      properties:
        specversion:
          type: string
          description: CloudEvents specification version. Always "1.0".
          enum: ["1.0"]
        id:
          type: string
          format: uuid
          description: >
            Unique identifier for this event occurrence, a UUID v4. Together
            with `source` it uniquely identifies the event, which is what
            consumers deduplicate on.
        source:
          type: string
          description: >
            The context that emitted the event. Always
            `/warehouse/inventory-storage` for this service.
          enum: ["/warehouse/inventory-storage"]
        type:
          type: string
          description: >
            Reverse-DNS event type, of the form
            `com.warehouse.wms.inventory-storage.<entity>.<EventName>`. Pinned
            to a single value by each concrete event schema.
        subject:
          type: string
          description: >
            The id of the aggregate instance this event is about — a
            reservation id, a StockUnit id, a bin id, or a SKU, depending on
            the event. Never empty.
        time:
          type: string
          format: date-time
          description: >
            RFC 3339 timestamp of when the event occurred in the domain,
            taken from the injected Clock port, not from wall-clock time at
            publish.
        datacontenttype:
          type: string
          description: Media type of the `data` member. Always application/json.
          enum: ["application/json"]
        dataschema:
          type: string
          format: uri
          description: >
            Absolute URI naming the payload shape and version:
            `urn:warehouse:inventory-storage:<events|analytics>:<EventName>:v<N>`.
            Pinned per message by each concrete event schema (the `events`
            variant for StockReserved/ReservationRevoked, `analytics` for the
            rest; StockReserved and ReservationRevoked also appear on the
            analytics topic with the `analytics` variant).
          pattern: "^urn:warehouse:inventory-storage:(events|analytics):[A-Za-z]+:v[0-9]+$"
        data:
          type: object
          description: The event payload. Shape is fixed by `dataschema`.

    StockReceivedEvent:
      description: CloudEvents envelope for a StockReceived domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for StockReceived.
              const: "com.warehouse.wms.inventory-storage.stock.StockReceived"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:StockReceived:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:StockReceived:v1$"
            data:
              type: object
              description: Business payload for StockReceived.
              required:
                - sku
                - quantity
              properties:
                sku:
                  type: string
                  description: The stock keeping unit the goods were received against.
                quantity:
                  type: integer
                  minimum: 1
                  description: >
                    Quantity received and staged. Always positive; the domain
                    rejects a non-positive receipt.

    ItemStowedEvent:
      description: CloudEvents envelope for an ItemStowed domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for ItemStowed.
              const: "com.warehouse.wms.inventory-storage.stock.ItemStowed"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:ItemStowed:v1 on the integration topic, ...:analytics:ItemStowed:v1 on the analytics topic (ADR 0043).
              pattern: "^urn:warehouse:inventory-storage:(events|analytics):ItemStowed:v1$"
            data:
              type: object
              description: Business payload for ItemStowed.
              required:
                - sku
                - bin_id
                - quantity
              properties:
                sku:
                  type: string
                  description: The stock keeping unit that was stowed (the item scan).
                bin_id:
                  type: string
                  description: >
                    The bin the quantity was placed into (the location scan).
                    Chaotic storage: any SKU may occupy any free bin.
                quantity:
                  type: integer
                  minimum: 1
                  description: Quantity placed into the bin. Always positive.

    LocationRecordedEvent:
      description: CloudEvents envelope for a LocationRecorded domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for LocationRecorded.
              const: "com.warehouse.wms.inventory-storage.stock.LocationRecorded"
            dataschema:
              type: string
              description: Reserved for if LocationRecorded is ever published; it is in-process only today.
              pattern: "^urn:warehouse:inventory-storage:events:LocationRecorded:v1$"
            data:
              type: object
              description: Business payload for LocationRecorded.
              required:
                - stock_unit_id
                - bin_id
              properties:
                stock_unit_id:
                  type: string
                  description: Identifier of the StockUnit whose location is now known.
                bin_id:
                  type: string
                  description: The bin that authoritatively holds that StockUnit.

