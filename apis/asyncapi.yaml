asyncapi: 2.6.0

info:
  title: Inventory & Storage Domain Events
  version: "1.0.0"
  description: >
    Domain-event catalog for the **inventory-storage** bounded context, the
    WMS-tier authoritative record of what is held where, and what portion of
    it is usable. This context implements chaotic (random) stow:
    there is no fixed product location — an inbound item may be stowed into
    any free bin, and this service records the exact bin it landed in. It
    supplies "stock reality" to the Work Planning bounded context
    (wes-work-planning) and makes allocation a *revocable* reservation, so a
    failed physical pick never strands an order.


    **Envelope.** Every message on this channel is a CloudEvents 1.0
    *structured-mode* JSON document with content type
    `application/cloudevents+json`. The CloudEvents context attributes carry
    routing and identity (`specversion`, `id`, `source`, `type`, `subject`,
    `time`, `datacontenttype`); the business payload lives entirely under
    `data`. `source` is always `/warehouse/inventory-storage`, and `subject`
    is the id of the aggregate instance the event is about (a reservation id,
    a stock unit id, or a bin id).


    **The `type` attribute** follows the platform-wide reverse-DNS convention
    `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>` — all
    lowercase except the final PascalCase event name. For this context the
    subdomain is `wms` (Warehouse Management System, a core subdomain) and the
    bounded context is `inventory-storage`, so for example a stow produces
    `com.warehouse.wms.inventory-storage.stock.ItemStowed` and a revoked
    allocation produces
    `com.warehouse.wms.inventory-storage.reservation.ReservationRevoked`.


    **Aggregates and entity groupings.** Three aggregates raise every event
    documented here. The **StockUnit** aggregate (entity segment `stock`)
    raises `StockReceived`, `ItemStowed`, `LocationRecorded` and
    `ItemUnlocated`. The **Reservation** aggregate (entity segment
    `reservation`) raises `StockReserved`, `ReservationExpired`,
    `ReservationRevoked` and `StockPicked` — `StockPicked` is grouped with the
    reservation because it is emitted by ConfirmPick when a reservation is
    consumed, and reservation id is the only identity it carries. The
    **Bin/Location** aggregate (entity segment `bin`) raises
    `CycleCountCompleted` and `DiscrepancyDetected`.


    **What reaches Kafka.** This document is the complete domain-event
    catalog for the bounded context. Two topics carry a subset of it:
    `warehouse.inventory.events` (the integration contract — `StockReserved`,
    `ReservationRevoked`, the transfer replies, the transfer receipt/stow events,
    `BinStockLevelChanged` (the per-bin absolute level feed, ADR 0040), and
    the promoted exception facts `DiscrepancyDetected`, `ItemUnlocated` and
    `ItemStowed` (ADR 0043 — byte-identical copies of the analytics feed),
    from `internal/adapters/outbound/kafka/publisher.go`) and
    `warehouse.inventory.analytics` (the analytics data product — every
    message below except `LocationRecorded`, from
    `internal/adapters/outbound/kafka/analytics_publisher.go`). Each message
    says which topics it reaches. `LocationRecorded` is in-process only (no
    consumer; decided 2026-10-06). Product-master owns product classification
    (ADR 0034); the legacy `ProductClassified` and the one-shot
    `republish-product-classifications` backfill that re-emitted it were
    removed at product-master ADR 0003 stage E (2026-10-17).


    **Consumed.** This service also consumes product-master's
    `warehouse.product-master.events` (channel below, ADR 0034) into a local
    copy of every SKU's classification that StowStock reads. Applying it
    raises no event here. It also consumes fulfillment-execution's
    `TaskCompleted` from `warehouse.fulfillment.events` (channel below, ADR
    0035) to confirm a completed order's reservations as picked once the order's
    LAST PICK task completes (one PICK task per order line, counted per order);
    that raises this service's own `StockPicked` (analytics topic) per
    reservation. And it consumes inbound-receiving's `ReceiptLineReceived`
    from `warehouse.inbound-receiving.events` (channel below, ADR 0037): a
    line with `condition=Good` is booked as a staged receipt through the
    existing ReceiveStock use case (the same `StockReceived` as
    `POST /stock/receive`, analytics topic; quantity staged, stow stays the RF
    action); `Damaged` is not booked in v1. And it consumes
    returns-processing's `ReturnLineStaged` from
    `warehouse.returns-processing.events` (channel below, ADR 0044): the
    RESTOCK disposition's handover is booked through the SAME ReceiveStock
    seam as a receipt line (same `StockReceived`, analytics topic; quantity
    staged, stow stays the RF action).


    **CloudEvents is mandatory (ADR-0024).** Every message on both topics is
    exactly the CloudEvents 1.0 structured-mode event documented here — all
    of `specversion`, `id`, `source`, `type`, `subject`, `time`,
    `datacontenttype` and `dataschema` are required — and every Kafka message
    carries the header `content-type: application/cloudevents+json;
    charset=UTF-8`. The same `type` names an occurrence on both topics;
    `dataschema` (`urn:warehouse:inventory-storage:<events|analytics>:<EventName>:v1`)
    names the payload shape. Each schema's `data` is the exact wire payload;
    `StockReserved` and `ReservationRevoked`, which reach both topics, give
    one `data` shape per `dataschema`. There is no other envelope.
  contact:
    name: Warehouse Systems Platform Team
    url: https://github.com/claudioed/inventory-storage
    email: claudioed.oliveira@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: inventory-storage
    description: >
      The inventory-storage bounded context (wms subdomain) — the authoritative
      record of what stock is held in which bin, and how much of it is usable.
  - name: stock
    description: >
      Events raised by the StockUnit aggregate: a quantity of a SKU at a
      specific bin, its receipt, its stow, and its loss.
  - name: reservation
    description: >
      Events raised by the Reservation aggregate: the revocable binding of a
      quantity to demand, its timeout, its revocation, and its consumption.
  - name: bin
    description: >
      Events raised by the Bin/Location aggregate: cycle counts verifying a
      bin's contents and the discrepancies they reveal.
  - name: product
    description: >
      Events about SKU-level handling master data (hazmat, fragile,
      temperature, ...). Owned by product-master since ADR 0034; this
      service consumes product-master's own events.
  - name: product-master
    description: >
      Events consumed from the product-master bounded context (wms
      subdomain), the owner of SKU master data (ADR 0034).
  - name: fulfillment-execution
    description: >
      Events consumed from the fulfillment-execution bounded context (wes
      subdomain): TaskCompleted, from which picks are confirmed (ADR 0035).
  - name: inbound-receiving
    description: >
      Events consumed from the inbound-receiving bounded context (wms
      subdomain): ReceiptLineReceived, from which Good lines are booked as
      staged stock (ADR 0037).
  - name: returns-processing
    description: >
      Events consumed from the returns-processing bounded context (wms
      subdomain): ReturnLineStaged, from which restocked return lines are
      booked as staged stock (ADR 0044).

servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >
      The shared warehouse-systems Kafka broker. Locally this is the broker
      started by `~/warehouse-systems/docker-compose.kafka.yml`, addressed via
      the `KAFKA_BROKERS` environment variable (required, no default).
      Events always leave through the transactional outbox and its relay
      (ADR 0042); there is no log publisher.

defaultContentType: application/cloudevents+json

channels:
  warehouse.inventory.events:
    description: >
      The outbound integration topic for this bounded context (the `Topic`
      constant in `internal/adapters/outbound/kafka/publisher.go`). Reaching
      it: `StockReserved` and `ReservationRevoked` (keyed by reservation
      id), the transfer replies and receipt/stow events (keyed by transfer line id),
      `StockRelocated` (keyed by relocation id, ADR 0039),
      `BinStockLevelChanged` (keyed by `<bin>:<sku>`, ADR 0040) and the
      promoted exception facts `DiscrepancyDetected`, `ItemUnlocated` and
      `ItemStowed` (ADR 0043 — byte-identical copies of the analytics
      feed, consumed by exception-management and returns-processing) and the
      container events `ContainerRegistered`, `ContainerStowed`, `CaseBroken`
      and `ContainerEmptied` (keyed by LPN, ADR 0045/0046). The legacy
      `ProductClassified` was retired at product-master ADR 0003 stage E
      (2026-10-17). The primary downstream consumer is
      wes-work-planning, which dispatches on their full `type` strings and
      projects them into its `UsableInventoryObserved` read model, keyed by
      SKU.
    subscribe:
      operationId: consumeInventoryStorageEvents
      summary: Consume inventory-storage domain events.
      description: >
        Subscribe to the domain events raised by the inventory-storage
        bounded context. Messages are CloudEvents 1.0 structured-mode JSON;
        discriminate on the FULL `type` context attribute, which is fixed
        per message via a const in the schemas below, and dedupe on `id`.
        Consumers must ignore unknown `type` values (forward compatibility).
      tags:
        - name: inventory-storage
          description: Events emitted by the inventory-storage bounded context.
      message:
        oneOf:
          - $ref: "#/components/messages/StockReserved"
          - $ref: "#/components/messages/ReservationRevoked"
          - $ref: "#/components/messages/TransferStockAllocated"
          - $ref: "#/components/messages/TransferStockAllocationRejected"
          - $ref: "#/components/messages/TransferReceiptStaged"
          - $ref: "#/components/messages/TransferStockStowed"
          - $ref: "#/components/messages/StockRelocated"
          - $ref: "#/components/messages/BinStockLevelChanged"
          - $ref: "#/components/messages/DiscrepancyDetected"
          - $ref: "#/components/messages/ItemUnlocated"
          - $ref: "#/components/messages/ItemStowed"
          - $ref: "#/components/messages/ContainerRegistered"
          - $ref: "#/components/messages/ContainerStowed"
          - $ref: "#/components/messages/CaseBroken"
          - $ref: "#/components/messages/ContainerEmptied"

  warehouse.inventory.analytics:
    description: >
      The internal analytics topic feeding this service's Inventory Flow &
      Accuracy data product (ADR-0011), the `AnalyticsTopic` constant in
      `internal/adapters/outbound/kafka/analytics_publisher.go`. Same
      CloudEvents envelope and `type` strings as the integration topic, but
      `dataschema` is `urn:warehouse:inventory-storage:analytics:<EventName>:v1`
      and `data` is the analytics payload (snake_case, enriched with `sku`
      for reservation-lifecycle events). Consumed only by this service's own
      projector (`cmd/inventory-projector`), which dispatches on the full
      `type`, dedupes on `id`, and skips (WARN) anything that is not a valid
      CloudEvent. The legacy `ProductClassified` never reaches this topic
      and was retired at product-master ADR 0003 stage E (2026-10-17); the
      projector would acknowledge it without touching the read model.
    subscribe:
      operationId: consumeInventoryStorageAnalytics
      summary: Consume inventory-storage analytics events (internal).
      description: >
        Internal stream for the analytics projector. CloudEvents 1.0
        structured mode with the analytics `dataschema`; dispatch on the full
        `type`, dedupe on `id`, ignore unknown types.
      tags:
        - name: inventory-storage
          description: Events emitted by the inventory-storage bounded context.
      message:
        oneOf:
          - $ref: "#/components/messages/StockReceived"
          - $ref: "#/components/messages/ItemStowed"
          - $ref: "#/components/messages/ItemUnlocated"
          - $ref: "#/components/messages/StockReserved"
          - $ref: "#/components/messages/StockPicked"
          - $ref: "#/components/messages/ReservationExpired"
          - $ref: "#/components/messages/ReservationRevoked"
          - $ref: "#/components/messages/CycleCountCompleted"
          - $ref: "#/components/messages/DiscrepancyDetected"

  warehouse.product-master.events:
    description: >
      product-master's integration topic, its Published Language for SKU
      master data (product-master ADR 0001; the `ProductMasterTopic`
      constant in `internal/adapters/inbound/kafka/product_master_consumer.go`).
      CONSUMED by this service (ADR 0034), not published: key = SKU,
      `source=/warehouse/product-master`, `subject` = SKU. Only
      `com.warehouse.wms.product-master.product.ProductClassified` is acted
      on, and `ProductPackLevelDeclared` / `ProductPackLevelRetired` feed the
      local PackagingView (ADR 0046); `ProductRegistered`, `ProductDescriptionChanged`,
      `ProductDimensionsDeclared` and `ProductMeasured` share the topic and
      are committed past untouched. The consumer always runs, under the stable group id
      `PRODUCT_MASTER_CONSUMER_GROUP` (mandatory, as are `DATABASE_URL` and
      `KAFKA_BROKERS`).
    publish:
      operationId: applyProductMasterClassification
      summary: Apply product-master's ProductClassified to the local copy.
      description: >
        At-least-once, fixed group: FetchMessage, then CommitMessages only
        after the handler settles. The CloudEvents `id` is claimed in
        `processed_events` in the SAME transaction as the
        `product_classifications` upsert, which applies only when `version`
        is greater than the stored version (a missing row is inserted; legacy
        rows carry version 0). A transient database error retries the same
        message with capped backoff; a message that is not a valid
        CloudEvent, has an undecodable payload or breaks the classification
        invariants is logged and committed past. Nothing is published in
        response (no loop back to product-master).
      tags:
        - name: product-master
          description: Consumed from the product-master bounded context.
      message:
        oneOf:
          - $ref: "#/components/messages/ProductMasterProductClassified"
          - $ref: "#/components/messages/ProductMasterProductPackLevelDeclared"
          - $ref: "#/components/messages/ProductMasterProductPackLevelRetired"

  warehouse.facility.events:
    description: |
      facility-layout's integration topic. Consumed ONLY for the four types the
      facility cache dispatches on (ADR 0024 / this repo's ADR 0047):
      `ZoneRegistered` (zone classification: temperature + hazmat, for stow
      legality), `LocationSlotRegistered` (slot existence, zone and optional
      handling unit), `LocationSlotDecommissioned` (evict the slot; the stow
      check then fails open for it) and `LocationSlotHandlingUnitDeclared`
      (set/change a bin's handling unit, ADR 0040). Consumer group from env
      `FACILITY_CONSUMER_GROUP`; last write wins per subject (same partition).
    publish:
      operationId: applyFacilityCache
      summary: Apply facility-layout's published language to the facility cache.
      description: |
        Upserts/evicts facility cache rows in one transaction with the CloudEvents `id` claim; last write wins per subject.
      message:
        oneOf:
          - $ref: "#/components/messages/FacilityLayoutZoneRegistered"
          - $ref: "#/components/messages/FacilityLayoutLocationSlotRegistered"
          - $ref: "#/components/messages/FacilityLayoutLocationSlotDecommissioned"
          - $ref: "#/components/messages/FacilityLayoutLocationSlotHandlingUnitDeclared"

  warehouse.fulfillment.events:
    description: >
      fulfillment-execution's integration topic, its Published Language for
      task facts (the `FulfillmentTopic` constant in
      `internal/adapters/inbound/kafka/task_completed_consumer.go`). CONSUMED
      by this service (ADR 0035), not published: key = `subject` = task id,
      `source=/warehouse/fulfillment-execution`. Only
      `com.warehouse.wes.fulfillment-execution.task.TaskCompleted` is acted on
      (task_type `PICK`, ADR 0035/0036, and `RELOCATE`, ADR 0039);
      `TaskCPTMissed`, `PackageManifested` and the `Transfer*` facts share the
      topic and are committed past untouched. The consumer always runs (ADR 0042), under the stable group
      `TASK_COMPLETED_CONSUMER_GROUP` (mandatory, as are `DATABASE_URL` and
      `KAFKA_BROKERS`; chart default `inventory-storage-confirm-pick`).
      Poison messages and messages whose handling kept failing are written to
      `warehouse.fulfillment.events.dlq`.
    publish:
      operationId: confirmPicksFromTaskCompleted
      summary: Confirm the picked line's reservation (line_no), or fall back to confirming the order on its last TaskCompleted; apply a completed RELOCATE task as an intra-site stock move.
      description: >
        At-least-once, fixed group: FetchMessage, then CommitMessages only after
        the message settles. For `task_type = PICK` with a non-empty `order_ref`
        (the OrderId order-management reserved against, stored here as
        `demand_ref`) there are two paths.


        PER-LINE (ADR 0036, audit decision 18): when the event carries the
        additive `line_no`, exactly the ACTIVE reservation(s) with
        `demand_ref = order_ref` and `line_no` equal to the event's are
        confirmed through the existing ConfirmPick logic (stock decremented, bin
        capacity released, `StockPicked` raised); normally exactly one, since
        earlier attempts of the line are REVOKED. CONFIRMED and REVOKED ones are
        skipped; an EXPIRED one (ADR 0003) is skipped, logged and counted
        (`inventory.pick_confirmations{outcome=expired}`), never an error. Other
        lines of the order are never touched, so a line whose pick has not
        arrived stays ACTIVE and reserved. Nothing is counted on this path (no
        `order_pick_progress` row).


        COUNTING FALLBACK (ADR 0035, kept for backward compatibility): when the
        event has no `line_no`, or names a line that no reservation of the order
        carries but the order has reservations created before `line_no` existed
        (NULL), the pick is COUNTED for the order (table
        `order_pick_progress`) against those reservations only; when the count
        reaches their ACTIVE + CONFIRMED number (REVOKED and EXPIRED are not
        awaited), i.e. on the LAST pick, every ACTIVE one is confirmed. Earlier
        picks only record progress and settle as successful no-ops. Counter rows
        older than `ORDER_PICK_PROGRESS_RETENTION` (default 720h) are swept.
        The "one pick early" edge of that counting does not exist on the
        per-line path.


        The CloudEvents `id` claim in `processed_events`, the counter increment
        (fallback only) and all confirmations commit in ONE transaction, so a
        failure rolls everything back and the redelivery is applied in full; a
        redelivered id is a no-op, and a further PICK event for an already
        confirmed line confirms nothing new. No reservations for the order (a
        transfer or non-inventory order), a line with no reservation and no
        line-less ones to fall back to, a non-PICK task, a missing `order_ref`
        (a producer that predates the field) and every other event type are
        successful no-ops. A Task carries no SKU or quantity, so SHORT PICKS ARE
        NOT MODELLED. A `line_no` that is not an integer between 1 and 2147483647 is a malformed
        payload: dead-lettered at once.


        RELOCATE (ADR 0039, decision E1): a `task_type = RELOCATE` completion
        carries the additive `sku`, `from_bin`, `to_bin`, `quantity` and
        `relocation_ref` and is applied by ApplyRelocationTask, never by
        confirm-pick: the same RelocateStock as POST /relocations (reason
        SLOTTING, site = the source bin's site, source_ref = `relocation_ref`
        or the task id) moves the stock and enqueues `StockRelocated`, with
        the CloudEvents `id` claimed in `processed_events` under consumer
        `task-completed-relocate` in the SAME transaction, so a redelivery is
        a no-op and a failure un-claims the id. A completion that can never
        apply (a missing or invalid field, an unknown bin, bins of different
        sites, the same bin, too little usable stock, a full destination) is
        dead-lettered at once; a transient failure (database, concurrent
        modification) is retried; a shutdown mid-move commits nothing and
        dead-letters nothing.


        REPLENISH (ADR 0041): a `task_type = REPLENISH` completion carries the
        same additive `sku`, `from_bin`, `to_bin`, `quantity` plus the REQUIRED
        `request_ref` (the pick-face-replenishment request id, mirroring
        `relocation_ref`) and is applied by ApplyReplenishTask: the same
        RelocateStock with reason `REPLENISHMENT`, site = the source bin's
        site and source_ref = `request_ref` (no task-id fallback: the
        replenishment context closes a request by `source_ref == request_id`).
        It enqueues `StockRelocated` plus the two `BinStockLevelChanged`
        events (reason `REPLENISHMENT`, source bin then destination bin). The
        CloudEvents `id` is claimed in `processed_events` under consumer
        `task-completed-replenish` in the SAME transaction; classification of
        deterministic versus transient failures is that of RELOCATE, and a
        REPLENISH completion without `request_ref` is dead-lettered at once.


        A transient failure retries the same message with capped backoff (5
        attempts), then dead-letters it; an undecodable payload is dead-lettered
        at once; a message that is not a CloudEvent is skipped with a sampled
        WARN.
      tags:
        - name: fulfillment-execution
          description: Consumed from the fulfillment-execution bounded context.
      message:
        $ref: "#/components/messages/FulfillmentTaskCompleted"

  warehouse.inbound-receiving.events:
    description: >
      inbound-receiving's integration topic, its Published Language for ASNs,
      dock appointments and receipts (inbound-receiving ADR 0003; the
      `InboundReceivingTopic` constant in
      `internal/adapters/inbound/kafka/inbound_receipt_consumer.go`). CONSUMED
      by this service (ADR 0037), not published: key = ASN number,
      `source=/warehouse/inbound-receiving`, `subject` = the receipt id. Only
      `com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived` is acted
      on, and `ReceiptCartonReceived` creates or links Containers (ADR 0045,
      0046; it never books a quantity); `ASNRegistered`, `ASNCancelled`, `DockAppointment*`, `ReceiptOpened`
      and `ReceiptClosed` share the topic and are committed past untouched. The
      consumer always runs, under the stable group id
      `INBOUND_RECEIPT_CONSUMER_GROUP` (mandatory, as are `DATABASE_URL` and
      `KAFKA_BROKERS`).
    publish:
      operationId: bookInboundReceiptLine
      summary: Book a received Good line as a staged receipt.
      description: >
        At-least-once, fixed group: FetchMessage, then CommitMessages only after
        the handler settles. For `condition=Good` the CloudEvents `id` is
        claimed in `processed_events` (consumer `inbound-receipt-line`) in the
        SAME transaction as the existing ReceiveStock use case, which raises
        `StockReceived` through the outbox (analytics topic): the units are
        staged and not yet usable, and stow stays the RF action (item scan plus
        location scan). `POST /stock/receive` is unchanged and keeps working
        for ad-hoc receipts. `condition=Damaged` is NOT booked in v1
        (quarantine is a later ADR): it is claimed, logged at INFO and counted
        in `inventory.inbound_receipt_units{outcome=damaged_not_booked}`.
        A redelivered `id` is a no-op. A transient failure retries the same
        message with capped backoff; a message that is not a valid CloudEvent,
        has an undecodable payload, an empty `sku`, a non-positive `quantity` or an
        unknown `condition` is logged (WARN) and committed past.
      tags:
        - name: inbound-receiving
          description: Consumed from the inbound-receiving bounded context.
      message:
        oneOf:
          - $ref: "#/components/messages/InboundReceivingReceiptLineReceived"
          - $ref: "#/components/messages/InboundReceivingReceiptCartonReceived"

  warehouse.returns-processing.events:
    description: >
      returns-processing's integration topic, its Published Language for the
      reverse flow of goods (returns-processing ADR 0001; the
      `ReturnsProcessingTopic` constant in
      `internal/adapters/inbound/kafka/return_line_consumer.go`). CONSUMED
      by this service (ADR 0044), not published: key and `subject` = the
      disposition id, `source=/warehouse/returns-processing`. Only
      `com.warehouse.wms.returns-processing.disposition.ReturnLineStaged` is
      acted on (the RESTOCK disposition's handover);
      `ReturnAuthorized`, `ReturnAuthorizationRejected`, the `ReturnReceipt*`
      types, `UnexpectedReturnReceived` and `DispositionDecided` share the
      topic and are committed past untouched. The consumer always runs, under
      the stable group id `RETURN_LINE_CONSUMER_GROUP` (mandatory, as are
      `DATABASE_URL` and `KAFKA_BROKERS`).
    publish:
      operationId: bookReturnLine
      summary: Book a staged return line as a staged receipt.
      description: >
        At-least-once, fixed group: FetchMessage, then CommitMessages only
        after the handler settles. The CloudEvents `id` is claimed in
        `processed_events` (consumer `return-line-staged`, the flow's
        provenance record — the mirror of `inbound-receipt-line`) in the SAME
        transaction as the existing ReceiveStock use case — the SAME
        staged-receipt seam an inbound receipt line and
        `POST /stock/receive` drive — which raises `StockReceived` through
        the outbox (analytics topic): the units are staged and not yet
        usable, and stow stays the RF action (item scan plus location scan).
        Return context (`receipt_id`, `rma_id`, `disposition_id`, `site_id`,
        `received_at`) is logged, never stored on the stock event. A
        redelivered `id` is a no-op. A transient failure retries the same
        message with capped backoff; a message that is not a valid
        CloudEvent, has an undecodable payload, an empty `sku`, a
        non-positive `quantity`, an empty `disposition_id` or a `condition`
        other than the constant `Good` is logged (WARN) and committed past.
      tags:
        - name: returns-processing
          description: Consumed from the returns-processing bounded context.
      message:
        $ref: "#/components/messages/ReturnsProcessingReturnLineStaged"

  warehouse.network-inventory-planning.events:
    description: >
      network-inventory-planning's integration topic, its Published Language
      for transfer commands (the `Topic` constant in
      `internal/adapters/inbound/kafka/transfer_consumer.go`). CONSUMED by
      this service (ADR 0030), not published: key and `subject` = the
      transfer line id, `source=/warehouse/network-inventory-planning`.
      Only
      `com.warehouse.wes.network-inventory-planning.transfer.TransferAllocationRequested`
      is acted on; every other CloudEvents `type` on the topic is ignored.
      The consumer always runs (ADR 0042), under the stable group
      `TRANSFER_ALLOCATION_CONSUMER_GROUP` (mandatory, as are `DATABASE_URL`
      and `KAFKA_BROKERS`; chart default
      `inventory-storage-transfer-allocation`).
    publish:
      operationId: allocateTransferStock
      summary: Apply the transfer-allocation command and reply through the outbox.
      description: >
        At-least-once, fixed group: FetchMessage, then CommitMessages only
        after the handler settles; a transient error retries the SAME message
        with capped backoff (200ms to 5s), so a failed handler can never drop
        or skip a command. The CloudEvents `id` is claimed in
        `processed_events` in the SAME transaction as AllocateTransferStock,
        so a redelivery is a no-op. A payload that can never be applied (an
        undecodable payload, an invalid `origin_site_id`, an empty `sku`, a
        non-positive `quantity`) is logged (WARN) and committed past; there
        is no DLQ on this topic. The reply — TransferStockAllocated or
        TransferStockAllocationRejected — is published on this service's own
        integration topic through the transactional outbox, never back onto
        the command topic.
      tags:
        - name: network-inventory-planning
          description: Consumed from the network-inventory-planning bounded context.
      message:
        $ref: "#/components/messages/NetworkInventoryPlanningTransferAllocationRequested"

components:
  messages:
    StockReceived:
      name: StockReceived
      title: Stock Received
      summary: Goods were received against a SKU and staged, awaiting stow.
      description: >
        Raised by the ReceiveStock use case when inbound goods are booked in
        against a SKU. The quantity is *staged* — it is not yet in a bin and
        is therefore not usable; it becomes usable only once ItemStowed
        records the bin it landed in.


        Published to `warehouse.inventory.analytics` only (subject = SKU, Kafka key = SKU). Analytics `data`: `{sku, quantity}`.
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised by the StockUnit aggregate.
      payload:
        $ref: "#/components/schemas/StockReceivedEvent"
      examples:
        - name: receivedFiftyUnits
          summary: Fifty units of SKU-1001 received and staged.
          payload:
            specversion: "1.0"
            id: 8f6b1c2e-6c1e-4c0a-9b3a-2f4d5e6a7b81
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.StockReceived
            subject: SKU-1001
            time: "2026-08-21T22:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:StockReceived:v1
            data:
              sku: SKU-1001
              quantity: 50

    ItemStowed:
      x-no-consumer-reason: "pending: promoted to the integration topic; network-fulfillment cache consumer in flight, no spec declares it yet"
      name: ItemStowed
      title: Item Stowed
      summary: A quantity of a SKU was placed into a bin.
      description: >
        Raised by the StowStock use case once BOTH an item scan and a location
        scan are present — a stow without both is rejected, because skipping
        either is precisely how inventory gets lost. Chaotic storage applies:
        any SKU may go into any free bin, provided the bin's capacity is not
        exceeded. This is the point at which the quantity becomes usable.


        **Published to both topics** (promoted to the integration topic
        2026-10-21, ADR 0043, so returns-processing can close its restock
        loop on it). Subject = Kafka key = SKU on both topics; `data` is
        byte-identical: `{sku, bin_id, quantity}`. Only the `dataschema`
        stream differs (`...:events:` vs `...:analytics:`).
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised by the StockUnit aggregate.
      payload:
        $ref: "#/components/schemas/ItemStowedEvent"
      examples:
        - name: stowedIntoBinA12
          summary: Fifty units of SKU-1001 stowed into bin A-12-3.
          payload:
            specversion: "1.0"
            id: 2c5d9a71-3b6f-4a18-8e2c-91d0f7b4c6a2
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.ItemStowed
            subject: SKU-1001
            time: "2026-08-21T22:05:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:ItemStowed:v1
            data:
              sku: SKU-1001
              bin_id: A-12-3
              quantity: 50

    LocationRecorded:
      name: LocationRecorded
      title: Location Recorded
      summary: A bin now authoritatively holds a given StockUnit.
      description: >
        Raised by the StowStock use case immediately after ItemStowed. It
        binds a StockUnit id to a bin id, which is the invariant this whole
        bounded context exists to protect: every physical item has exactly one
        known bin, or is explicitly flagged Unlocated.


        In-process only — not published to any Kafka topic. Documented as part of the domain-event catalog.
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised by the StockUnit aggregate.
      payload:
        $ref: "#/components/schemas/LocationRecordedEvent"
      examples:
        - name: locationRecordedForStockUnit
