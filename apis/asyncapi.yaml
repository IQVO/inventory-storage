              condition: Damaged
              received_at: "2026-10-09T08:12:00Z"

    StockReserved:
      name: StockReserved
      title: Stock Reserved
      summary: A quantity was revocably bound to demand.
      description: >
        Raised by the ReserveStock use case when a reservation is successfully
        created against *usable* inventory (on-hand minus active reservations
        minus held/unlocated stock). The binding is revocable and carries a
        timeout, so a physical failure downstream never strands the demand.


        **Published to both topics.** On `warehouse.inventory.events`
        (dataschema `urn:warehouse:inventory-storage:events:StockReserved:v1`)
        the `data` payload is the adapter's `reservationData` shape — `sku`,
        `quantity`, `demand_ref` — and the reservation id is the CloudEvents
        `subject` and the Kafka key. wes-work-planning consumes this exact
        `type` to update its `UsableInventoryObserved` read model by SKU. On
        `warehouse.inventory.analytics` (dataschema
        `...:analytics:StockReserved:v1`, Kafka key = reservation id — ADR 0021) `data` is
        `{sku, reservation_id, quantity}`.
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Raised by the Reservation aggregate.
      payload:
        $ref: "#/components/schemas/StockReservedEvent"
      examples:
        - name: reservedForOrder42
          summary: Five units of SKU-1 reserved for demand reference order-42.
          payload:
            specversion: "1.0"
            id: 1f7a4c30-9b2d-4e85-a6c1-7d3f0b5e8a94
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.StockReserved
            subject: res-1
            time: "2026-08-21T22:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:StockReserved:v1
            data:
              sku: SKU-1
              quantity: 5
              demand_ref: order-42

    TransferStockAllocated:
      name: TransferStockAllocated
      title: Transfer Stock Allocated
      summary: Origin-site stock was reserved for a network transfer line.
      description: >
        Raised by the AllocateTransferStock use case when a transfer
        allocation command from network-inventory-planning
        (com.warehouse.wes.network-inventory-planning.transfer.TransferAllocationRequested
        on warehouse.network-inventory-planning.events) was satisfied:
        usable stock in the ORIGIN SITE's custody was drawn and a
        revocable Reservation now holds it, correlated to the transfer
        line via the transfer_allocations ledger (one row per
        transfer_line_id, DB-unique — replays return this same event's
        original outcome without re-deciding).


        **Integration topic only** (no analytics variant: the Inventory
        Flow & Accuracy projection has no transfer dimension). Kafka key
        and CloudEvents `subject` are the reservation id, so a transfer's
        replies stay per-reservation ordered (ADR 0021).
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Raised on the Reservation aggregate's stock-holding path.
      payload:
        $ref: "#/components/schemas/TransferStockAllocatedEvent"
      examples:
        - name: allocatedForTransferLine
          summary: Six units of SKU-T1 reserved at SITE-A for transfer line tl-77-1.
          payload:
            specversion: "1.0"
            id: 3f9d2b66-8c41-4e07-b2a9-6d5c1e0f4b21
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.TransferStockAllocated
            subject: res-tr-1
            time: "2026-10-06T12:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:TransferStockAllocated:v1
            data:
              transfer_id: tr-77
              transfer_line_id: tl-77-1
              origin_site_id: SITE-A
              reservation_id: res-tr-1
              sku: SKU-T1
              quantity: 6
              allocations:
                - stock_unit_id: su-1
                  bin_id: BIN-1
                  quantity: 4
                - stock_unit_id: su-2
                  bin_id: BIN-2
                  quantity: 2
              expires_at: "2026-10-06T12:30:00Z"

    TransferStockAllocationRejected:
      name: TransferStockAllocationRejected
      title: Transfer Stock Allocation Rejected
      summary: No stock was held for a network transfer line; the closed reason says why.
      description: >
        Raised by the AllocateTransferStock use case when a transfer
        allocation command could not be satisfied. `reason` is a CLOSED
        set: ORIGIN_SITE_UNKNOWN (no usable stock in the requested origin
        site's custody — including legacy site-less stock, which is never
        transfer-allocatable), INSUFFICIENT_USABLE (the origin holds the
        SKU but not enough usable quantity), IDEMPOTENCY_CONFLICT (the
        transfer_line_id was replayed with a DIFFERENT command payload;
        the original ledger decision stands and this reply tells the
        planner so).


        **Integration topic only** (no analytics variant). Kafka key and
        CloudEvents `subject` are the transfer_line_id — a rejection has
        no reservation, so the line is the aggregate the reply is about.
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Reply on the transfer allocation command path.
      payload:
        $ref: "#/components/schemas/TransferStockAllocationRejectedEvent"
      examples:
        - name: rejectedInsufficientUsable
          summary: SITE-B could not cover nine units of SKU-T2.
          payload:
            specversion: "1.0"
            id: 5a1e7c93-d4f8-4b60-c3d7-7e9b2f6a8c15
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.TransferStockAllocationRejected
            subject: tl-77-2
            time: "2026-10-06T12:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:TransferStockAllocationRejected:v1
            data:
              transfer_id: tr-77
              transfer_line_id: tl-77-2
              origin_site_id: SITE-B
              sku: SKU-T2
              requested_quantity: 9
              reason: INSUFFICIENT_USABLE

    TransferReceiptStaged:
      name: TransferReceiptStaged
      title: Transfer Receipt Staged
      summary: A destination site counted goods against a recognized ALLOCATED transfer line.
      description: >-
        Raised by the StageTransferReceipt use case (ADR 0033,
        destination receipt custody — POST /transfers/{transferLineId}/receipt).
        The transfer_line_id was found in the transfer_allocations ledger
        with outcome ALLOCATED: a transfer_receipts row (state STAGED,
        DB-unique on transfer_line_id) now records expected_quantity from
        the ledger, received_quantity as counted, and the SIGNED variance
        (received - expected; positive = over, negative = short).
        Over/short is explicit on the wire, never silently absorbed.


        NO usable stock moves at this step — the destination site's
        usable rises only when the stow completes (TransferStockStowed).
        An unrecognized scan is NOT this event: it is quarantined as an
        inventory_exceptions row and publishes nothing that raises
        availability.


        **Integration topic only** (no analytics variant: the Inventory
        Flow & Accuracy projection has no transfer dimension). Kafka key
        and CloudEvents `subject` are the transfer_line_id, so a line's
        stage-then-stow facts stay ordered on one partition (ADR 0021).
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised on the destination receipt custody path (ADR 0033).
      payload:
        $ref: "#/components/schemas/TransferReceiptStagedEvent"
      examples:
        - name: shortReceiptStaged
          summary: Five of six expected units of SKU-T1 counted at SITE-DEST (short by one).
          payload:
            specversion: "1.0"
            id: 8c2f4e71-a5b3-4c68-d9e0-1f4a7b8c9d21
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.TransferReceiptStaged
            subject: tl-77-1
            time: "2026-10-06T12:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:TransferReceiptStaged:v1
            data:
              transfer_id: tr-77
              transfer_line_id: tl-77-1
              destination_site_id: SITE-DEST
              sku: SKU-T1
              expected_quantity: 6
              received_quantity: 5
              variance: -1

    TransferStockStowed:
      name: TransferStockStowed
      title: Transfer Stock Stowed
      summary: A staged transfer receipt was placed into destination bins — destination usable rose, exactly once.
      description: >-
        Raised by the StowTransferStock use case (ADR 0033 — POST
        /transfers/{transferLineId}/stow): the ONLY path that raises the
        destination site's usable stock for a transfer. One StockUnit per
        bin leg was created AT the destination site
        (NewStockUnitAtSite), every bin verified to belong to that
        site's custody, the quantities summed exactly to the receipt's
        received_quantity, and the receipt moved STAGED -> STOWED.


        Idempotent at the database level: a replayed stow for a STOWED
        receipt returns the original outcome and republishes NOTHING —
        exactly one of these events exists per transfer_line_id.


        **Integration topic only** (no analytics variant). Kafka key and
        CloudEvents `subject` are the transfer_line_id, matching
        TransferReceiptStaged so a line's facts stay per-line ordered
        (ADR 0021).
      contentType: application/cloudevents+json
      tags:
        - name: stock
          description: Raised on the destination stow custody path (ADR 0033).
      payload:
        $ref: "#/components/schemas/TransferStockStowedEvent"
      examples:
        - name: stowedIntoTwoBins
          summary: Five units of SKU-T1 placed into two SITE-DEST bins.
          payload:
            specversion: "1.0"
            id: 9d3a5f82-b6c4-4d79-e0f1-2a5b8c9d0e32
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.stock.TransferStockStowed
            subject: tl-77-1
            time: "2026-10-06T12:05:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:TransferStockStowed:v1
            data:
              transfer_id: tr-77
              transfer_line_id: tl-77-1
              destination_site_id: SITE-DEST
              sku: SKU-T1
              received_quantity: 5
              stowed_quantity: 5
              allocations:
                - stock_unit_id: su-dest-1
                  bin_id: BIN-DEST-1
                  quantity: 3
                - stock_unit_id: su-dest-2
                  bin_id: BIN-DEST-2
                  quantity: 2

    ReservationExpired:
      name: ReservationExpired
      title: Reservation Expired
      summary: A reservation's timeout elapsed before pick confirmation.
      description: >
        Describes a reservation that timed out without being confirmed or
        revoked, so its quantity returns to usable. Raised lazily: the
        Reservation aggregate's `IsExpired`/`Expire()` are invoked the next
        time the reservation is read (GetReservationsByDemandRef,
        RevokeReservation, ConfirmPick, or ReserveStock's own idempotency
        lookup), not by a background sweeper — see ADR 0003's "Lazy expiry"
        section for the full rationale.


        Published to `warehouse.inventory.analytics` only (subject = Kafka
        key = reservation id), with the reservation's SKU enriched in:
        analytics `data` is `{reservation_id, sku}`. It does not cross to the
        integration topic.
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Raised by the Reservation aggregate.
      payload:
        $ref: "#/components/schemas/ReservationExpiredEvent"
      examples:
        - name: reservationTimedOut
          summary: Reservation res-9 timed out before its pick was confirmed.
          payload:
            specversion: "1.0"
            id: 6d1c8b45-2e70-4f39-9a5b-c0e7d2f14b36
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.ReservationExpired
            subject: res-9
            time: "2026-08-21T22:30:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:ReservationExpired:v1
            data:
              reservation_id: res-9
              sku: SKU-1

    ReservationRevoked:
      name: ReservationRevoked
      title: Reservation Revoked
      summary: A reservation was cancelled and its quantity returned to usable.
      description: >
        Raised by the RevokeReservation use case. Revocation is the mechanism
        that keeps a physical failure — a blocked pod, a lost tote, a chute
        jam, a short pick — from stranding an order: the quantity goes back to
        usable and the demand can be re-allocated against a different holding.


        **Published to both topics.** On `warehouse.inventory.events`
        (dataschema `urn:warehouse:inventory-storage:events:ReservationRevoked:v1`)
        the domain event carries only the reservation id, so the adapter
        enriches it through `ports.ReservationRepo` and emits the same
        `sku` / `quantity` / `demand_ref` shape as StockReserved; if the
        lookup finds nothing the publish fails rather than emitting a partial
        payload. The reservation id is the `subject` and the Kafka key.
        wes-work-planning consumes this exact `type`. On
        `warehouse.inventory.analytics` `data` is `{reservation_id, sku}`.
      contentType: application/cloudevents+json
      tags:
        - name: reservation
          description: Raised by the Reservation aggregate.
      payload:
        $ref: "#/components/schemas/ReservationRevokedEvent"
      examples:
        - name: revokedAfterShortPick
          summary: Reservation res-1 revoked, returning five units of SKU-1 to usable.
          payload:
            specversion: "1.0"
            id: 4b9e2f61-7c3a-4d08-85e2-1a6f9c0d3b72
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.reservation.ReservationRevoked
            subject: res-1
            time: "2026-08-21T22:10:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:events:ReservationRevoked:v1
            data:
              sku: SKU-1
              quantity: 5
              demand_ref: order-42

    StockPicked:
      name: StockPicked
      title: Stock Picked
      summary: Reserved quantity was physically removed from its bin.
      description: >
        Raised by the ConfirmPick use case. It consumes the reservation — a
        reservation cannot be double-consumed — and permanently removes the
        quantity from on-hand. Grouped under the `reservation` entity segment
        because the reservation id is the only identity the event carries.


        Published to `warehouse.inventory.analytics` only (subject = reservation id, Kafka key = reservation id — ADR 0021). Analytics `data`: `{sku, reservation_id, quantity}`.
      contentType: application/cloudevents+json
      tags:
