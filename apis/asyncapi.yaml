            subject: task-8a20
            time: "2026-10-06T15:01:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
            data:
              task_id: task-8a20
              station_id: station-03
              work_unit_id: wu-8a20
              associate_id: worker-42
              duration_seconds: 120
              task_type: PICK
              order_ref: ORD-1001
              line_no: 2
        - name: pickTaskCompleted
          summary: One PICK task (one order line) of order ORD-1001 completed, from a producer that does not send line_no (counting fallback, ADR 0035).
          payload:
            specversion: "1.0"
            id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
            source: /warehouse/fulfillment-execution
            type: com.warehouse.wes.fulfillment-execution.task.TaskCompleted
            subject: task-8a1f
            time: "2026-10-06T15:00:00Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
            data:
              task_id: task-8a1f
              station_id: station-03
              work_unit_id: wu-8a1f
              associate_id: worker-42
              duration_seconds: 245
              task_type: PICK
              order_ref: ORD-1001

    InboundReceivingReceiptLineReceived:
      name: InboundReceivingReceiptLineReceived
      title: Receipt Line Received (from inbound-receiving, consumed)
      summary: A quantity was received against an ASN line at the dock; Good units are booked as staged stock here.
      description: >
        CONSUMED, not produced (ADR 0037). Pinned by inbound-receiving's
        `apis/asyncapi.yaml` (the handover event of its ADR 0003): type
        `com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived`,
        `source=/warehouse/inbound-receiving`, subject = the receipt id, Kafka
        key = the ASN number. `data` is snake_case:
        `{receipt_id, asn_number, line_no, sku, quantity, condition,
        received_at}` with `condition` one of `Good` or `Damaged`. This service
        books `sku` and `quantity` of a `Good` line through ReceiveStock (its
        own clock stamps the resulting `StockReceived`; `received_at`,
        `receipt_id`, `asn_number` and `line_no` are logged, not stored) and
        does not book a `Damaged` line.
