              system: 50
              discrepancy: false

    DiscrepancyDetected:
      name: DiscrepancyDetected
      title: Discrepancy Detected
      summary: A cycle count found system records did not match physical reality.
      description: >
        Raised by the RunCycleCount use case when the counted quantity differs
        from the system quantity for a bin, before reconciliation is applied.
        A shortfall additionally produces ItemUnlocated events for the
        quantity that could not be found.


        Published to `warehouse.inventory.analytics` only (subject = bin id, Kafka key = bin id). Analytics `data`: `{bin_id, counted, system}`.
      contentType: application/cloudevents+json
      tags:
        - name: bin
          description: Raised by the Bin/Location aggregate.
      payload:
        $ref: "#/components/schemas/DiscrepancyDetectedEvent"
      examples:
        - name: binCountShort
          summary: Bin A-12-3 counted at 47 units against a system record of 50.
          payload:
            specversion: "1.0"
            id: c2a90b76-8e34-4f51-9d07-4b6e1c8a37f9
            source: /warehouse/inventory-storage
            type: com.warehouse.wms.inventory-storage.bin.DiscrepancyDetected
            subject: A-12-3
            time: "2026-08-21T23:00:01Z"
            datacontenttype: application/json
            dataschema: urn:warehouse:inventory-storage:analytics:DiscrepancyDetected:v1
            data:
              bin_id: A-12-3
              counted: 47
              system: 50

  schemas:
    CloudEventBase:
      type: object
      description: >
        The CloudEvents 1.0 context attributes shared by every message this
        bounded context emits, in structured-mode JSON. Each concrete event
        schema composes this with `allOf` and pins `type` to a single value.
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - dataschema
        - data
      properties:
        specversion:
          type: string
          description: CloudEvents specification version. Always "1.0".
          enum: ["1.0"]
        id:
          type: string
          format: uuid
          description: >
            Unique identifier for this event occurrence, a UUID v4. Together
            with `source` it uniquely identifies the event, which is what
            consumers deduplicate on.
        source:
          type: string
          description: >
            The context that emitted the event. Always
            `/warehouse/inventory-storage` for this service.
          enum: ["/warehouse/inventory-storage"]
        type:
          type: string
          description: >
            Reverse-DNS event type, of the form
            `com.warehouse.wms.inventory-storage.<entity>.<EventName>`. Pinned
            to a single value by each concrete event schema.
        subject:
          type: string
          description: >
            The id of the aggregate instance this event is about — a
            reservation id, a StockUnit id, a bin id, or a SKU, depending on
            the event. Never empty.
        time:
          type: string
          format: date-time
          description: >
            RFC 3339 timestamp of when the event occurred in the domain,
            taken from the injected Clock port, not from wall-clock time at
            publish.
        datacontenttype:
          type: string
          description: Media type of the `data` member. Always application/json.
          enum: ["application/json"]
        dataschema:
          type: string
          format: uri
          description: >
            Absolute URI naming the payload shape and version:
            `urn:warehouse:inventory-storage:<events|analytics>:<EventName>:v<N>`.
            Pinned per message by each concrete event schema (the `events`
            variant for StockReserved/ReservationRevoked, `analytics` for the
            rest; StockReserved and ReservationRevoked also appear on the
            analytics topic with the `analytics` variant).
          pattern: "^urn:warehouse:inventory-storage:(events|analytics):[A-Za-z]+:v[0-9]+$"
        data:
          type: object
          description: The event payload. Shape is fixed by `dataschema`.

    StockReceivedEvent:
      description: CloudEvents envelope for a StockReceived domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for StockReceived.
              const: "com.warehouse.wms.inventory-storage.stock.StockReceived"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:StockReceived:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:StockReceived:v1$"
            data:
              type: object
              description: Business payload for StockReceived.
              required:
                - sku
                - quantity
              properties:
                sku:
                  type: string
                  description: The stock keeping unit the goods were received against.
                quantity:
                  type: integer
                  minimum: 1
                  description: >
                    Quantity received and staged. Always positive; the domain
                    rejects a non-positive receipt.

    ItemStowedEvent:
      description: CloudEvents envelope for an ItemStowed domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for ItemStowed.
              const: "com.warehouse.wms.inventory-storage.stock.ItemStowed"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:ItemStowed:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:ItemStowed:v1$"
            data:
              type: object
              description: Business payload for ItemStowed.
              required:
                - sku
                - bin_id
                - quantity
              properties:
                sku:
                  type: string
                  description: The stock keeping unit that was stowed (the item scan).
                bin_id:
                  type: string
                  description: >
                    The bin the quantity was placed into (the location scan).
                    Chaotic storage: any SKU may occupy any free bin.
                quantity:
                  type: integer
                  minimum: 1
                  description: Quantity placed into the bin. Always positive.

    LocationRecordedEvent:
      description: CloudEvents envelope for a LocationRecorded domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for LocationRecorded.
              const: "com.warehouse.wms.inventory-storage.stock.LocationRecorded"
            dataschema:
              type: string
              description: Reserved for if LocationRecorded is ever published; it is in-process only today.
              pattern: "^urn:warehouse:inventory-storage:events:LocationRecorded:v1$"
            data:
              type: object
              description: Business payload for LocationRecorded.
              required:
                - stock_unit_id
                - bin_id
              properties:
                stock_unit_id:
                  type: string
                  description: Identifier of the StockUnit whose location is now known.
                bin_id:
                  type: string
                  description: The bin that authoritatively holds that StockUnit.

    ProductClassifiedEvent:
      description: >
        CloudEvents envelope for the legacy ProductClassified event. Since
        ADR 0034 only the integration-topic (`events`) variant is emitted, by
        the backfill command; the `analytics` dataschema is still accepted by
        the encoder's frozen contract but no longer produced.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for ProductClassified.
              const: "com.warehouse.wms.inventory-storage.product.ProductClassified"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:ProductClassified:v1 on the integration topic, ...:analytics:ProductClassified:v1 on the analytics topic.
              pattern: "^urn:warehouse:inventory-storage:(events|analytics):ProductClassified:v1$"
            data:
              type: object
              description: >
                Full-state replacement of the SKU's classification. Optional
                fields are omitted when unset.
              required:
                - sku
                - handling_tags
              properties:
                sku:
                  type: string
                  description: The classified SKU (also the CloudEvents subject and Kafka key).
                handling_tags:
                  type: array
                  minItems: 1
                  description: Non-empty, duplicate-free set of handling tags, in the aggregate's stable enum order.
                  items:
                    type: string
                    enum: [Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue]
                temperature_class:
                  type: string
                  enum: [Ambient, Chilled, Frozen]
                  description: Present if and only if handling_tags includes TemperatureSensitive.
                dot_hazard_class:
                  type: integer
                  minimum: 1
                  maximum: 9
                  description: Top-level US DOT hazard class; present only for a Hazmat classification with one recorded (ADR 0010).

    ProductMasterProductClassifiedEvent:
      type: object
      description: >
        CloudEvents 1.0 envelope of product-master's ProductClassified as
        consumed here (not composed from CloudEventBase, whose `source` is
        this service's own).
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          enum: ["1.0"]
        id:
          type: string
          description: CloudEvents id; the dedupe key (claimed in processed_events).
        source:
          type: string
          enum: ["/warehouse/product-master"]
        type:
          type: string
          const: "com.warehouse.wms.product-master.product.ProductClassified"
        subject:
          type: string
          description: The SKU (also the Kafka key).
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          enum: ["application/json"]
        dataschema:
          type: string
          description: urn:warehouse:product-master:events:ProductClassified:v1
        data:
          type: object
          required:
            - sku
            - handling_tags
            - classification_source
            - version
          properties:
            sku:
              type: string
            handling_tags:
              type: array
              minItems: 1
              description: Stable order Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue.
              items:
                type: string
                enum: [Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue]
            temperature_class:
              type: string
              enum: [Ambient, Chilled, Frozen]
              description: Present if and only if handling_tags includes TemperatureSensitive.
            dot_hazard_class:
              type: integer
              minimum: 1
              maximum: 9
              description: Present only for a Hazmat classification with one recorded.
            classification_source:
              type: string
              enum: [native, legacy-import]
              description: Stored verbatim as product_classifications.classification_source.
            version:
              type: integer
              format: int64
              minimum: 1
              description: product-master's Product.version; applied only when greater than the stored version.

    FulfillmentTaskCompletedEvent:
      type: object
      description: >
        CloudEvents 1.0 envelope of fulfillment-execution's TaskCompleted v1 as
        consumed here (not composed from CloudEventBase, whose `source` is this
        service's own). Only the fields this service reads are listed under
        `data`; the producer sends more.
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          enum: ["1.0"]
        id:
          type: string
          description: CloudEvents id; the dedupe key (claimed in processed_events under consumer `task-completed-confirm-pick`).
        source:
          type: string
          enum: ["/warehouse/fulfillment-execution"]
        type:
          type: string
          const: "com.warehouse.wes.fulfillment-execution.task.TaskCompleted"
        subject:
          type: string
          description: The task id (also the Kafka key).
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          enum: ["application/json"]
        dataschema:
          type: string
          description: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
        data:
          type: object
          required:
            - task_id
          properties:
            task_id:
              type: string
            task_type:
              type: string
              enum: [PICK, PACK, SLAM, REBIN, DISPATCH, ARRIVAL]
              description: Only PICK is acted on; omitted by the producer when the task could not be found.
            order_ref:
              type: string
              description: >
                The completed task's order reference = the OrderId order-management
                reserved against (this service's reservation `demand_ref`). Every
                PICK task of an order (one per order line) carries the same value.
                Additive and optional (ADR 0035): omitted when empty, in which case
                nothing is counted or confirmed.
            line_no:
              type: integer
              minimum: 1
              maximum: 2147483647
              description: >
                The order line this task was for (the `line_no` the reservation of
                that line was made with). Additive and optional (ADR 0036): omitted
                when unknown. When present, exactly the ACTIVE reservation(s) of
                (`order_ref`, `line_no`) are confirmed and nothing is counted; when
                absent the ADR 0035 last-pick counting applies. A value outside
                1..2147483647 (the 32-bit line_no column) or a non-integer is a
                malformed payload (dead-lettered).

    InboundReceivingReceiptLineReceivedEvent:
      type: object
      description: >
        CloudEvents 1.0 envelope of inbound-receiving's ReceiptLineReceived v1
        as consumed here (not composed from CloudEventBase, whose `source` is
        this service's own).
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          enum: ["1.0"]
        id:
          type: string
          description: CloudEvents id; the dedupe key (claimed in processed_events under consumer `inbound-receipt-line`).
        source:
          type: string
          enum: ["/warehouse/inbound-receiving"]
        type:
          type: string
          const: "com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived"
        subject:
          type: string
          description: The receipt id (the Kafka key is the ASN number).
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          enum: ["application/json"]
        dataschema:
          type: string
          description: urn:warehouse:inbound-receiving:events:ReceiptLineReceived:v1
        data:
          type: object
          required:
            - receipt_id
            - asn_number
            - line_no
            - sku
            - quantity
            - condition
            - received_at
          properties:
            receipt_id:
              type: string
            asn_number:
              type: string
            line_no:
              type: integer
              minimum: 1
            sku:
              type: string
              description: Must be non-empty; an empty SKU is logged and committed past.
            quantity:
              type: integer
              minimum: 1
              description: Units received on this occurrence. A value <= 0 is logged and committed past.
            condition:
              type: string
              enum: [Good, Damaged]
              description: Only Good is booked as stock (ADR 0037); Damaged is counted and ignored; any other value is logged and committed past.
            received_at:
              type: string
              format: date-time

    StockReservedEvent:
      description: >
        CloudEvents envelope for a StockReserved domain event, on both
        topics; `dataschema` selects the `data` shape.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for StockReserved.
              const: "com.warehouse.wms.inventory-storage.reservation.StockReserved"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:StockReserved:v1 on the integration topic, ...:analytics:StockReserved:v1 on the analytics topic.
              pattern: "^urn:warehouse:inventory-storage:(events|analytics):StockReserved:v1$"
            data:
              description: >
                One shape per dataschema: the integration payload on
                warehouse.inventory.events, the analytics payload on
                warehouse.inventory.analytics.
              oneOf:
              - type: object
                description: >
                  Business payload for StockReserved, matching the adapter's
                  `reservationData` struct field-for-field.
                required:
                  - sku
                  - quantity
                  - demand_ref
                properties:
                  sku:
                    type: string
                    description: The stock keeping unit the quantity was reserved against.
                  quantity:
                    type: integer
                    minimum: 1
                    description: >
                      Quantity bound to the demand. Never exceeds usable
                      inventory for the SKU at reserve time.
                  demand_ref:
                    type: string
                    description: >
                      Opaque reference to the demand this reservation serves,
                      supplied by the caller — typically an order or shipment id.
              - type: object
                title: analytics
                description: Analytics payload (dataschema ...:analytics:StockReserved:v1).
                required:
                  - sku
                  - reservation_id
                  - quantity
                properties:
                  sku:
                    type: string
                  reservation_id:
                    type: string
                  quantity:
                    type: integer
                    minimum: 1

    ReservationExpiredEvent:
      description: CloudEvents envelope for a ReservationExpired domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for ReservationExpired.
              const: "com.warehouse.wms.inventory-storage.reservation.ReservationExpired"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:ReservationExpired:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:ReservationExpired:v1$"
            data:
              type: object
              description: Business payload for ReservationExpired.
              required:
                - reservation_id
                - sku
              properties:
                reservation_id:
                  type: string
                  description: >
                    Identifier of the reservation whose timeout elapsed. Its
                    quantity returns to usable inventory.
                sku:
                  type: string
                  description: >
                    The reservation's SKU, enriched by the publisher through
                    ports.ReservationRepo. Empty if the reservation could not
                    be found (best-effort enrichment).

    ReservationRevokedEvent:
      description: >
        CloudEvents envelope for a ReservationRevoked domain event. The `data`
        member is enriched by the outbound Kafka adapter, which looks the
        reservation up through ports.ReservationRepo because the domain event
        carries only the reservation id.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for ReservationRevoked.
              const: "com.warehouse.wms.inventory-storage.reservation.ReservationRevoked"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:ReservationRevoked:v1 on the integration topic, ...:analytics:ReservationRevoked:v1 on the analytics topic.
              pattern: "^urn:warehouse:inventory-storage:(events|analytics):ReservationRevoked:v1$"
            data:
              description: >
                One shape per dataschema: the integration payload on
                warehouse.inventory.events, the analytics payload on
                warehouse.inventory.analytics.
              oneOf:
              - type: object
                description: >
                  Business payload for ReservationRevoked, identical in shape to
                  StockReserved so downstream projections can apply both with
                  one handler.
                required:
                  - sku
                  - quantity
                  - demand_ref
                properties:
                  sku:
                    type: string
                    description: The stock keeping unit whose quantity returns to usable.
                  quantity:
                    type: integer
                    minimum: 1
                    description: Quantity released back into usable inventory.
                  demand_ref:
                    type: string
                    description: >
                      The demand reference the revoked reservation was serving,
                      so the consumer can re-allocate it elsewhere.
              - type: object
                title: analytics
                description: Analytics payload (dataschema ...:analytics:ReservationRevoked:v1).
                required:
                  - reservation_id
                  - sku
                properties:
                  reservation_id:
                    type: string
                  sku:
                    type: string
                    description: Enriched via ports.ReservationRepo; empty if not found.

    StockPickedEvent:
      description: CloudEvents envelope for a StockPicked domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for StockPicked.
              const: "com.warehouse.wms.inventory-storage.reservation.StockPicked"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:StockPicked:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:StockPicked:v1$"
            data:
              type: object
              description: Business payload for StockPicked.
              required:
                - reservation_id
                - sku
                - quantity
              properties:
                reservation_id:
                  type: string
                  description: >
                    Identifier of the reservation that was consumed by this
                    pick. A reservation can be consumed only once.
                sku:
                  type: string
                  description: The stock keeping unit that was picked.
                quantity:
                  type: integer
                  minimum: 1
                  description: >
                    Quantity physically removed from its bin and permanently
                    deducted from on-hand.

    ItemUnlocatedEvent:
      description: CloudEvents envelope for an ItemUnlocated domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for ItemUnlocated.
              const: "com.warehouse.wms.inventory-storage.stock.ItemUnlocated"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:ItemUnlocated:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:ItemUnlocated:v1$"
            data:
              type: object
              description: Business payload for ItemUnlocated.
              required:
                - stock_unit_id
                - sku
                - bin_id
                - quantity
              properties:
                stock_unit_id:
                  type: string
                  description: Identifier of the StockUnit that was flagged Unlocated.
                sku:
                  type: string
                  description: The stock keeping unit that could not be found.
                bin_id:
                  type: string
                  description: The bin the stock was believed to be in.
                quantity:
                  type: integer
                  minimum: 1
                  description: >
                    Quantity that could not be accounted for, now removed from
                    usable inventory.

    CycleCountCompletedEvent:
      description: CloudEvents envelope for a CycleCountCompleted domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for CycleCountCompleted.
              const: "com.warehouse.wms.inventory-storage.bin.CycleCountCompleted"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:CycleCountCompleted:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:CycleCountCompleted:v1$"
            data:
              type: object
              description: Business payload for CycleCountCompleted.
              required:
                - bin_id
                - counted
                - system
                - discrepancy
              properties:
                bin_id:
                  type: string
                  description: The bin whose contents were verified.
                counted:
                  type: integer
                  minimum: 0
                  description: Quantity physically counted in the bin.
                system:
                  type: integer
                  minimum: 0
                  description: Quantity the system believed was in the bin.
                discrepancy:
                  type: boolean
                  description: >
                    Whether counted and system quantities differed. When true,
                    a DiscrepancyDetected event accompanies this one.

    DiscrepancyDetectedEvent:
      description: CloudEvents envelope for a DiscrepancyDetected domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for DiscrepancyDetected.
              const: "com.warehouse.wms.inventory-storage.bin.DiscrepancyDetected"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:analytics:DiscrepancyDetected:v1
              pattern: "^urn:warehouse:inventory-storage:analytics:DiscrepancyDetected:v1$"
            data:
              type: object
              description: Business payload for DiscrepancyDetected.
              required:
                - bin_id
                - counted
                - system
              properties:
                bin_id:
                  type: string
                  description: The bin whose count did not match system records.
                counted:
                  type: integer
                  minimum: 0
                  description: Quantity physically counted in the bin.
                system:
                  type: integer
                  minimum: 0
                  description: Quantity the system believed was in the bin.

    TransferStockAllocatedEvent:
      description: CloudEvents envelope for a TransferStockAllocated domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferStockAllocated.
              const: "com.warehouse.wms.inventory-storage.reservation.TransferStockAllocated"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferStockAllocated:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferStockAllocated:v1$"
            data:
              type: object
              description: Business payload for TransferStockAllocated.
              required:
                - transfer_id
                - transfer_line_id
                - origin_site_id
                - reservation_id
                - sku
                - quantity
                - allocations
                - expires_at
              properties:
                transfer_id:
                  type: string
                  description: The planning context's transfer (saga) id.
                transfer_line_id:
                  type: string
                  description: The transfer line this allocation decides; DB-unique in the ledger.
                origin_site_id:
                  type: string
                  description: The site whose custody donated the stock.
                reservation_id:
                  type: string
                  description: The Reservation aggregate now holding the stock.
                sku:
                  type: string
                  description: The stock keeping unit allocated.
                quantity:
                  type: integer
                  minimum: 1
                  description: Total quantity held for the transfer line.
                allocations:
                  type: array
                  minItems: 1
                  description: Per-stock-unit draws with pick locations.
                  items:
                    type: object
                    required:
                      - stock_unit_id
                      - bin_id
                      - quantity
                    properties:
                      stock_unit_id:
                        type: string
                      bin_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                expires_at:
                  type: string
                  format: date-time
                  description: When the holding reservation times out (revocable).

    TransferStockAllocationRejectedEvent:
      description: CloudEvents envelope for a TransferStockAllocationRejected domain event.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferStockAllocationRejected.
              const: "com.warehouse.wms.inventory-storage.reservation.TransferStockAllocationRejected"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferStockAllocationRejected:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferStockAllocationRejected:v1$"
            data:
              type: object
              description: Business payload for TransferStockAllocationRejected.
              required:
                - transfer_id
                - transfer_line_id
                - origin_site_id
                - sku
                - requested_quantity
                - reason
              properties:
                transfer_id:
                  type: string
                transfer_line_id:
                  type: string
                origin_site_id:
                  type: string
                sku:
                  type: string
                requested_quantity:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  enum:
                    - ORIGIN_SITE_UNKNOWN
                    - INSUFFICIENT_USABLE
                    - IDEMPOTENCY_CONFLICT
                  description: >
                    Closed rejection reason set. ORIGIN_SITE_UNKNOWN: no
                    usable stock in the origin site's custody (including
                    legacy site-less stock). INSUFFICIENT_USABLE: origin
                    holds the SKU but not enough usable quantity.
                    IDEMPOTENCY_CONFLICT: the line id was replayed with a
                    different payload; the original decision stands.

    TransferReceiptStagedEvent:
      description: CloudEvents envelope for a TransferReceiptStaged domain event (ADR 0033).
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferReceiptStaged.
              const: "com.warehouse.wms.inventory-storage.stock.TransferReceiptStaged"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferReceiptStaged:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferReceiptStaged:v1$"
            data:
              type: object
              description: >-
                Business payload for TransferReceiptStaged. The receipt is
                STAGED: counted, not yet placed; no usable stock moved.
              required:
                - transfer_id
                - transfer_line_id
                - destination_site_id
                - sku
                - expected_quantity
                - received_quantity
                - variance
              properties:
                transfer_id:
                  type: string
                  description: The planning context's transfer (saga) id.
                transfer_line_id:
                  type: string
                  description: The transfer line this receipt stages; DB-unique in transfer_receipts.
                destination_site_id:
                  type: string
                  description: The receiving site whose dock counted the goods.
                sku:
                  type: string
                  description: The stock keeping unit counted.
                expected_quantity:
                  type: integer
                  minimum: 1
                  description: What the transfer_allocations ledger promised (requested_quantity).
                received_quantity:
                  type: integer
                  minimum: 1
                  description: What was physically counted at the dock.
                variance:
                  type: integer
                  description: >-
                    SIGNED received - expected. Positive = over-receipt,
                    negative = short-receipt, 0 = exact. Explicit, never
                    silently absorbed.

    TransferStockStowedEvent:
      description: CloudEvents envelope for a TransferStockStowed domain event (ADR 0033).
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              description: Fixed event type for TransferStockStowed.
              const: "com.warehouse.wms.inventory-storage.stock.TransferStockStowed"
            dataschema:
              type: string
              description: urn:warehouse:inventory-storage:events:TransferStockStowed:v1
              pattern: "^urn:warehouse:inventory-storage:events:TransferStockStowed:v1$"
            data:
              type: object
              description: >-
                Business payload for TransferStockStowed. The destination
                site's usable stock rose by exactly received_quantity,
                once, through the StockUnits listed in allocations.
              required:
                - transfer_id
                - transfer_line_id
                - destination_site_id
                - sku
                - received_quantity
                - stowed_quantity
                - allocations
              properties:
                transfer_id:
                  type: string
                transfer_line_id:
                  type: string
                destination_site_id:
                  type: string
                  description: The site whose custody the new StockUnits were created in.
                sku:
                  type: string
                received_quantity:
                  type: integer
                  minimum: 1
                  description: The receipt's counted quantity.
                stowed_quantity:
                  type: integer
                  minimum: 1
                  description: Total quantity placed (equals received_quantity).
                allocations:
                  type: array
                  minItems: 1
                  description: The destination StockUnits created, with the bin each was placed into.
                  items:
                    type: object
                    required:
                      - stock_unit_id
                      - bin_id
                      - quantity
                    properties:
                      stock_unit_id:
                        type: string
                      bin_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
