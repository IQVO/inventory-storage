          enum: ["application/json"]
        dataschema:
          type: string
          description: urn:warehouse:product-master:events:ProductClassified:v1
        data:
          type: object
          required:
            - sku
            - handling_tags
            - classification_source
            - version
          properties:
            sku:
              type: string
            handling_tags:
              type: array
              minItems: 1
              description: Stable order Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue.
              items:
                type: string
                enum: [Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue]
            temperature_class:
              type: string
              enum: [Ambient, Chilled, Frozen]
              description: Present if and only if handling_tags includes TemperatureSensitive.
            dot_hazard_class:
              type: integer
              minimum: 1
              maximum: 9
              description: Present only for a Hazmat classification with one recorded.
            classification_source:
              type: string
              enum: [native, legacy-import]
              description: Stored verbatim as product_classifications.classification_source.
            version:
              type: integer
              format: int64
              minimum: 1
              description: product-master's Product.version; applied only when greater than the stored version.

    FulfillmentTaskCompletedEvent:
      type: object
      description: >
        CloudEvents 1.0 envelope of fulfillment-execution's TaskCompleted v1 as
        consumed here (not composed from CloudEventBase, whose `source` is this
        service's own). Only the fields this service reads are listed under
        `data`; the producer sends more.
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          enum: ["1.0"]
        id:
          type: string
          description: CloudEvents id; the dedupe key (claimed in processed_events under consumer `task-completed-confirm-pick`, `task-completed-relocate` for RELOCATE tasks, or `task-completed-replenish` for REPLENISH tasks).
        source:
          type: string
          enum: ["/warehouse/fulfillment-execution"]
        type:
          type: string
          const: "com.warehouse.wes.fulfillment-execution.task.TaskCompleted"
        subject:
          type: string
          description: The task id (also the Kafka key).
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          enum: ["application/json"]
        dataschema:
          type: string
          description: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
        data:
          type: object
          required:
            - task_id
          properties:
            task_id:
              type: string
            task_type:
              type: string
              enum: [PICK, PACK, SLAM, REBIN, DISPATCH, ARRIVAL, RELOCATE, REPLENISH]
              description: PICK, RELOCATE and REPLENISH are acted on; omitted by the producer when the task could not be found.
            order_ref:
              type: string
              description: >
                The completed task's order reference = the OrderId order-management
                reserved against (this service's reservation `demand_ref`). Every
                PICK task of an order (one per order line) carries the same value.
                Additive and optional (ADR 0035): omitted when empty, in which case
                nothing is counted or confirmed.
            line_no:
              type: integer
              minimum: 1
              maximum: 2147483647
              description: >
                The order line this task was for (the `line_no` the reservation of
                that line was made with). Additive and optional (ADR 0036): omitted
                when unknown. When present, exactly the ACTIVE reservation(s) of
                (`order_ref`, `line_no`) are confirmed and nothing is counted; when
                absent the ADR 0035 last-pick counting applies. A value outside
                1..2147483647 (the 32-bit line_no column) or a non-integer is a
                malformed payload (dead-lettered).
            sku:
              type: string
              description: >
                RELOCATE and REPLENISH only (additive, ADR 0039, ADR 0041): the SKU moved. Required on a
                RELOCATE or REPLENISH completion (missing or invalid = dead-lettered); absent on
                every other task type.
            from_bin:
              type: string
              description: >
                RELOCATE and REPLENISH only (additive): the source bin's location code;
                its site is the move's site.
            to_bin:
              type: string
              description: >
                RELOCATE and REPLENISH only (additive): the destination bin's location
                code; must be a different bin of the same site.
            quantity:
              type: integer
              minimum: 1
              description: >
                RELOCATE and REPLENISH only (additive): the units moved. Missing, zero
                or negative on a RELOCATE or REPLENISH completion = dead-lettered.
            relocation_ref:
              type: string
              maxLength: 200
              description: >
                RELOCATE only (additive, ADR 0039, optional): the slot-plan move the
                task executes; stored as the relocation's source_ref (the task id
                is used when absent).
            request_ref:
              type: string
              maxLength: 200
              description: >
                REPLENISH only (additive, ADR 0041, REQUIRED): the pick-face
                replenishment request id; stored as the relocation's source_ref
                (reason REPLENISHMENT) and echoed in StockRelocated. Missing or
                blank = dead-lettered; there is no task-id fallback.

    InboundReceivingReceiptLineReceivedEvent:
      type: object
      description: >
        CloudEvents 1.0 envelope of inbound-receiving's ReceiptLineReceived v1
        as consumed here (not composed from CloudEventBase, whose `source` is
        this service's own).
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          enum: ["1.0"]
        id:
          type: string
          description: CloudEvents id; the dedupe key (claimed in processed_events under consumer `inbound-receipt-line`).
        source:
          type: string
          enum: ["/warehouse/inbound-receiving"]
        type:
          type: string
          const: "com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived"
        subject:
          type: string
          description: The receipt id (the Kafka key is the ASN number).
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          enum: ["application/json"]
        dataschema:
          type: string
          description: urn:warehouse:inbound-receiving:events:ReceiptLineReceived:v1
        data:
          type: object
          required:
            - receipt_id
            - asn_number
            - line_no
            - sku
            - quantity
            - condition
            - received_at
          properties:
            receipt_id:
              type: string
            asn_number:
              type: string
            line_no:
              type: integer
              minimum: 1
            sku:
              type: string
              description: Must be non-empty; an empty SKU is logged and committed past.
            quantity:
              type: integer
              minimum: 1
              description: Units received on this occurrence. A value <= 0 is logged and committed past.
            condition:
              type: string
              enum: [Good, Damaged]
              description: Only Good is booked as stock (ADR 0037); Damaged is counted and ignored; any other value is logged and committed past.
            received_at:
              type: string
              format: date-time
            owner_ref:
              type: string
              maxLength: 64
              description: Optional (ADR 0046). The owner of the received stock; absent means fleet-owned. A malformed value is logged and committed past.
